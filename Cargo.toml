[package]
name = "spl"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.5"
la-arena = "0.3"
lasso = "0.7"
logos = "0.15"
rowan = "0.15"
rustc-hash = "2.1"

# Cranelift code generation
cranelift-codegen = "0.120"
cranelift-frontend = "0.120"
cranelift-module = "0.120"
cranelift-jit = "0.120"
cranelift-native = "0.120"
cranelift-object = "0.120"
target-lexicon = "0.13"

# Object file parsing (for AOT validation)
object = "0.36"

# Stdlib embedding at compile time
include_dir = "0.7"

[dev-dependencies]
datatest-stable = { version = "0.3.3", features = ["include-dir"] }
pretty_assertions = "1.4"
expect-test = "1.5"

[[test]]
name = "stdlib_tests"
harness = false
