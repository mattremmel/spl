[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow common pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Borrow checker issues - map_or_else suggestions break with &mut self
option_if_let_else = "allow"
# Variable naming - too subjective
similar_names = "allow"
# Function length - complexity varies by domain
too_many_lines = "allow"
# Raw string hashes - stylistic in tests
needless_raw_string_hashes = "allow"
# Wildcard imports - acceptable in certain modules like tests
wildcard_imports = "allow"
# Items after statements - acceptable in local scopes
items_after_statements = "allow"
# Struct complexity - some structs legitimately need many bools
struct_excessive_bools = "allow"
# Large stack allocations - acceptable for compiler internals
large_stack_arrays = "allow"
# Casting - we target 64-bit platforms and know value ranges
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Float comparison - sometimes we want exact comparison for constants
float_cmp = "allow"
# Macro patterns - unnested is clearer in declarative macros
unnested_or_patterns = "allow"
# Self returning methods - covered by must_use_candidate
return_self_not_must_use = "allow"
# Explicit lifetimes - can improve readability
elidable_lifetime_names = "allow"
# Unused self - needed for trait impls and future use
unused_self = "allow"
# Comparison chains - if/else can be clearer than match
comparison_chain = "allow"
# Self recursion - acceptable pattern for recursive algorithms
self_only_used_in_recursion = "allow"
# Map unwrap patterns - map/unwrap_or can be clearer and avoids borrow issues
map_unwrap_or = "allow"

[workspace.dependencies]
# Internal crates
spl-lexer = { path = "crates/spl-lexer" }
spl-diagnostic = { path = "crates/spl-diagnostic" }
spl-syntax = { path = "crates/spl-syntax" }
spl-parser = { path = "crates/spl-parser" }
spl-ast = { path = "crates/spl-ast" }
spl-sema = { path = "crates/spl-sema" }

# Core dependencies
ariadne = "0.5"
la-arena = "0.3"
lasso = "0.7"
logos = "0.15"
rowan = "0.15"
rustc-hash = "2.1"

# Cranelift code generation
cranelift-codegen = "0.120"
cranelift-frontend = "0.120"
cranelift-module = "0.120"
cranelift-jit = "0.120"
cranelift-native = "0.120"
cranelift-object = "0.120"
target-lexicon = "0.13"

# Object file parsing (for AOT validation)
object = "0.36"

# Stdlib embedding at compile time
include_dir = "0.7"

# Error handling
thiserror = "2"

# Dev dependencies
datatest-stable = { version = "0.3.3", features = ["include-dir"] }
pretty_assertions = "1.4"
expect-test = "1.5"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
proptest = "1"
