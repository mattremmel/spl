[section]
id = "stmts.blocks"
spec_chapter = "3"
name = "Blocks and Statements"

[[case]]
name = "block_empty"
source = "fn f() {}"

[[case]]
name = "block_multiple_stmts"
source = """
fn f() {
    let x = 1
    let y = 2
    x + y
}
"""

[[case]]
name = "block_nested"
source = """
fn f() {
    {
        let x = 1
        {
            let y = 2
        }
    }
}
"""

[[case]]
name = "block_nested_items"
source = """
fn f() {
    fn inner(): i32 { return 42 }
    let x = inner()
}
"""

[[case]]
name = "block_attributed_nested_item"
source = """
fn f() {
    #[inline]
    fn inner(): i32 { return 42 }
}
"""

[[case]]
name = "block_expr_stmts"
source = """
fn f() {
    foo()
    bar()
    baz()
}
"""

[[case]]
name = "block_nested_struct"
source = """
fn f() {
    struct Inner(x: i32)
}
"""

[[case]]
name = "block_nested_enum"
source = """
fn f() {
    enum Color { Red, Green, Blue }
}
"""

[[case]]
name = "block_nested_type_alias"
source = "fn f() { type MyInt = i32 }"

[[case]]
name = "block_nested_const"
source = "fn f() { const X: i32 = 42 }"

[[case]]
name = "block_expr_then_item"
source = """
fn f() {
    foo();
    fn helper(): i32 { 0 }
}
"""

[[case]]
name = "block_nested_static"
source = "fn f() { static X: i32 = 0 }"

[[case]]
name = "block_multiple_stmts_semicolons"
source = "fn f() { let x = 1; let y = 2; x + y }"

[[case]]
name = "block_nested_trait"
source = """
fn f() {
    trait Local {
        fn method(&self): i32
    }
}
"""

[[case]]
name = "block_nested_impl"
source = """
fn f() {
    struct Inner(x: i32)
    impl Inner {
        fn new(): Inner { Inner(x: 0) }
    }
}
"""

[[case]]
name = "block_single_expr_value"
source = "fn f() { let x = { 42 } }"

[[case]]
name = "block_multi_stmt_no_value"
source = """
fn f() {
    {
        let a = 1
        let b = 2
    }
}
"""

[[case]]
name = "block_multi_stmt_break_value"
source = "fn f() { let x = 'a: { break 'a 42 } }"

[[case]]
name = "block_semicolons_same_line"
source = "fn f() { let a = 1; let b = 2; a + b }"

[[case]]
name = "block_if_no_semicolon"
source = """
fn f() {
    if true { do_something() }
    let x = 1
}
"""

[[case]]
name = "block_nested_fn"
source = """
fn f() {
    fn inner(): i32 { 42 }
    inner()
}
"""

[[case]]
name = "block_nested_module"
source = """
fn f() {
    module inner {}
}
"""

[[case]]
name = "block_only_items_no_stmts"
source = """
fn f() {
    struct Inner(x: i32)
    enum Color { Red }
    const MAX: i32 = 100
}
"""

[[case]]
name = "block_item_then_expr"
source = """
fn f() {
    fn helper(): i32 { 42 }
    helper()
}
"""

[[case]]
name = "block_deeply_nested_5"
source = """
fn f() {
    {
        {
            {
                {
                    {
                        42
                    }
                }
            }
        }
    }
}
"""

[[case]]
name = "block_expr_as_if_condition_value"
source = "fn f() { if { compute() } { do_something() } }"

[[case]]
name = "block_with_use"
source = """
fn f() {
    use std.io.Read
    let x = 1
}
"""

[[case]]
name = "block_labeled_with_early_return"
source = """
fn f() {
    let x = 'block: {
        if error { break 'block 0 }
        compute()
    }
}
"""
