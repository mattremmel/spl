[section]
id = "items.modules"
spec_chapter = "1.10"
name = "Module Declarations"

[[case]]
name = "module_inline"
source = """
module internal {
    fn helper(): i32 { return 42 }
}
"""

[[case]]
name = "module_pub"
source = """
pub module api {
    pub fn endpoint(): i32 { return 0 }
}
"""

[[case]]
name = "module_reference"
source = "module network;"

[[case]]
name = "module_nested"
source = """
module a {
    module b {
        fn foo() {}
    }
}
"""

[[case]]
name = "module_with_items"
source = """
module helpers {
    struct Point(x: i32, y: i32)
    fn foo() {}
}
"""

[[case]]
name = "module_with_use"
source = """
module foo {
    use super.Bar
}
"""

[[case]]
name = "module_with_attributes"
source = """
#[cfg(test)]
module tests {
    fn test_foo() {}
}
"""

[[case]]
name = "module_nested_items"
source = """
module inner {
    struct Point(x: i32)
    fn new(): Point { Point(x: 0) }
}
"""