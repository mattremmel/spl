[section]
id = "items.modules"
spec_chapter = "1.10"
name = "Module Declarations"

[[case]]
name = "module_inline"
source = """
module internal {
    fn helper(): i32 { return 42 }
}
"""

[[case]]
name = "module_pub"
source = """
pub module api {
    pub fn endpoint(): i32 { return 0 }
}
"""

[[case]]
name = "module_reference"
source = "module network;"

[[case]]
name = "module_nested"
source = """
module a {
    module b {
        fn foo() {}
    }
}
"""

[[case]]
name = "module_with_items"
source = """
module helpers {
    struct Point(x: i32, y: i32)
    fn foo() {}
}
"""

[[case]]
name = "module_with_use"
source = """
module foo {
    use super.Bar
}
"""

[[case]]
name = "module_with_attributes"
source = """
#[cfg(test)]
module tests {
    fn test_foo() {}
}
"""

[[case]]
name = "module_nested_items"
source = """
module inner {
    struct Point(x: i32)
    fn new(): Point { Point(x: 0) }
}
"""

[[case]]
name = "module_pub_super"
source = """
pub(super) module internal {
    fn helper() {}
}
"""

[[case]]
name = "module_pub_dollar"
source = """
pub($) module crate_internal {
    fn helper() {}
}
"""

[[case]]
name = "module_all_item_types"
source = """
module everything {
    struct Point(x: i32)
    enum Color { Red }
    trait Foo { fn bar(&self) }
    impl Point { fn new(): Point { Point(x: 0) } }
    const MAX: i32 = 100
    use super.Bar
}
"""

[[case]]
name = "module_deeply_nested"
source = """
module a {
    module b {
        module c {
            fn deep() {}
        }
    }
}
"""

[[case]]
name = "module_ref_with_attr"
source = "#[cfg(test)] module tests;"

[[case]]
name = "module_with_inner_attr"
expect_error = "expected"
source = """
module foo {
    #![allow(unused)]
    fn bar() {}
}
"""

[[case]]
name = "module_with_type_alias"
source = """
module types {
    type Id = i32
    type Name = String
}
"""

[[case]]
name = "module_with_extern"
source = """
module ffi {
    extern "C" {
        fn malloc(size: i32): Ptr(T: u8)
    }
}
"""