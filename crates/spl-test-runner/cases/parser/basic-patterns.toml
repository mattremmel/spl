[section]
id = "patterns.basic"
spec_chapter = "5"
name = "Basic Patterns"

[[case]]
name = "pat_identifier"
source = "fn f() { let x = 1 }"

[[case]]
name = "pat_mut"
source = "fn f() { let mut x = 1 }"

[[case]]
name = "pat_wildcard"
source = """
fn f() {
    match x {
        _ => 0,
    }
}
"""

[[case]]
name = "pat_literal_int"
source = """
fn f() {
    match x {
        42 => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_negative_literal"
source = """
fn f() {
    match x {
        -1 => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_string"
source = """
fn f() {
    match s {
        "hello" => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_char"
source = """
fn f() {
    match c {
        'a' => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_bool"
source = """
fn f() {
    match b {
        true => 1,
        false => 0,
    }
}
"""

[[case]]
name = "pat_range_exclusive"
source = """
fn f() {
    match x {
        0..10 => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_range_inclusive"
source = """
fn f() {
    match x {
        0..=10 => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_negative_float"
source = """
fn f() {
    match x {
        -3.14 => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "pat_range_chars"
source = """
fn f() {
    match c {
        'a'..='z' => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "pat_half_open_range"
source = """
fn f() {
    match x {
        0.. => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "pat_range_large_bound"
source = """
fn f() {
    match x {
        0..255 => "in range",
        _ => "out",
    }
}
"""

[[case]]
name = "pat_negative_int_large"
source = """
fn f() {
    match x {
        -1000 => "neg",
        _ => "other",
    }
}
"""

[[case]]
name = "pat_literal_float"
source = """
fn f() {
    match x {
        3.14 => "pi",
        _ => "other",
    }
}
"""

[[case]]
name = "pat_range_path_bound"
source = """
fn f() {
    match x {
        0..MAX => true,
        _ => false,
    }
}
"""

[[case]]
name = "pat_range_path_both_bounds"
source = """
fn f() {
    match x {
        MIN..MAX => true,
        _ => false,
    }
}
"""

[[case]]
name = "pat_range_inclusive_path"
source = """
fn f() {
    match x {
        0..=MAX_VAL => true,
        _ => false,
    }
}
"""

[[case]]
name = "pat_range_half_open_path"
source = """
fn f() {
    match x {
        MIN.. => true,
        _ => false,
    }
}
"""

[[case]]
name = "pat_range_qualified_path"
source = """
fn f() {
    match x {
        0..config.MAX => true,
        _ => false,
    }
}
"""
