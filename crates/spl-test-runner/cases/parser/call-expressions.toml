[section]
id = "expr.calls"
spec_chapter = "4"
name = "Call Expressions"

[[case]]
name = "call_simple"
source = "fn f() { foo() }"

[[case]]
name = "call_with_args"
source = "fn f() { foo(1, 2, 3) }"

[[case]]
name = "call_named_args"
source = "fn f() { greet(to: person) }"

[[case]]
name = "call_method_chain"
source = "fn f() { obj.method1().method2() }"

[[case]]
name = "call_trailing_comma"
source = "fn f() { foo(1, 2,) }"

[[case]]
name = "call_nested"
source = "fn f() { foo(bar(baz(1))) }"

[[case]]
name = "call_type_arg"
source = "fn f() { identity(T: i32, 42) }"

[[case]]
name = "call_multiple_type_args"
source = "fn f() { convert(From: i32, To: f64, value: 100) }"

[[case]]
name = "call_method_type_arg"
source = "fn f() { obj.method(T: i32, x: 1) }"

[[case]]
name = "call_struct_instantiation_named"
source = "fn f() { Point(x: 1, y: 2) }"

[[case]]
name = "call_type_expr_method"
source = "fn f() { Vec(T: i32).new() }"

[[case]]
name = "call_mixed_type_value_args"
source = "fn f() { parse(T: Config, input: text) }"

[[case]]
name = "call_shorthand_struct_fields"
source = "fn f() { Point(x, y) }"

[[case]]
name = "call_struct_update"
source = "fn f() { Point(x: 1, ...base) }"

[[case]]
name = "call_struct_update_only"
source = "fn f() { Point(...other) }"

[[case]]
name = "call_method_type_arg_collect"
source = "fn f() { items.collect(T: Vec(T: i32)) }"

[[case]]
name = "call_nested_struct"
source = "fn f() { Outer(inner: Inner(x: 1)) }"

[[case]]
name = "call_empty_args"
source = "fn f() { foo() }"

[[case]]
name = "call_method_with_type_arg"
source = "fn f() { list.collect(T: Vec(T: i32)) }"

[[case]]
name = "call_multiple_type_and_positional"
source = "fn f() { foo(T: i32, 42, 43) }"

[[case]]
name = "call_struct_mixed_shorthand_explicit"
source = "fn f() { Point(x, y: y + 1) }"

[[case]]
name = "call_type_expr_chain"
source = "fn f() { Vec(T: i32).with_capacity(10).push(42) }"

[[case]]
name = "call_struct_only_shorthand"
source = "fn f() { Point(x, y) }"

[[case]]
name = "call_generic_in_generic"
source = "fn f() { Box(T: Vec(T: i32), value: Vec.new()) }"

[[case]]
name = "call_struct_with_spread_and_trailing_comma"
expect_error = "expected"  # spread must be last arg, no trailing comma after it
source = "fn f() { Point(x: 1, ...base,) }"

[[case]]
name = "call_struct_only_spread"
source = "fn f() { Config(...defaults) }"

[[case]]
name = "call_struct_only_type_args"
source = "fn f() { Container(T: i32) }"

[[case]]
name = "call_closure_as_arg"
source = "fn f() { items.map(|x| x + 1) }"

[[case]]
name = "call_method_chain_with_type_args"
source = "fn f() { items.iter().map(|x| x).collect(T: Vec(T: i32)) }"

[[case]]
name = "call_nested_three_deep"
source = "fn f() { a(b(c(1, 2), 3), 4) }"

[[case]]
name = "call_method_on_literal"
source = """fn f() { "hello".len() }"""

[[case]]
name = "call_method_on_array"
source = "fn f() { [1, 2, 3].len() }"
