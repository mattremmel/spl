[section]
id = "misc.error_recovery"
spec_chapter = "0"
name = "Error Recovery"

[[case]]
name = "garbage_between_items"
expect_error = "expected"
source = "fn a() {} @@@ fn b() {}"

[[case]]
name = "empty_source"
source = ""

[[case]]
name = "whitespace_only"
source = "   "

[[case]]
name = "invalid_item_start"
expect_error = "expected"
source = "@@@ fn foo() {}"

[[case]]
name = "comment_only"
source = "// just a comment"

[[case]]
name = "multiple_valid_items"
source = """
fn a() {}
struct B()
fn c() {}
"""

[[case]]
name = "trailing_junk_after_item"
expect_error = "expected"
source = "fn foo() {} !!!"

[[case]]
name = "nested_unclosed_parens"
expect_error = "expected"
source = "fn f() { foo((1, 2) }"

[[case]]
name = "keyword_as_identifier"
expect_error = "expected"
source = "fn f() { let fn = 1 }"

[[case]]
name = "recovery_multiple_errors"
expect_error = "expected"
source = """
fn good1() {}
struct {
fn good2() {}
"""

[[case]]
name = "missing_comma_in_params"
expect_error = "expected"
source = "fn f(a: i32 b: i32) {}"

[[case]]
name = "extra_tokens_after_item"
expect_error = "expected"
source = "fn f() {} garbage"

[[case]]
name = "invalid_token_in_type_position"
expect_error = "expected"
source = "fn f() { let x: 42 = 1 }"

[[case]]
name = "missing_pattern_in_let"
expect_error = "expected"
source = "fn f() { let = 5 }"

[[case]]
name = "missing_in_for_loop"
expect_error = "expected"
source = "fn f() { for x items {} }"

[[case]]
name = "invalid_attribute_syntax"
expect_error = "expected"
source = "#(test) fn foo() {}"
