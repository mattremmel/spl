[section]
id = "items.structs"
spec_chapter = "1.4"
name = "Struct Definitions"

[[case]]
name = "struct_named_fields"
source = "struct Point(x: f64, y: f64)"

[[case]]
name = "struct_positional"
source = "struct Pair(i32, i32)"

[[case]]
name = "struct_empty"
source = "struct Empty()"

[[case]]
name = "struct_unit"
source = "struct Unit;"

[[case]]
name = "struct_generic_where"
source = "struct Box(value: T) where T"

[[case]]
name = "struct_pub_fields"
