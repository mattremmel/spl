[[case]]
name = "struct_with_methods_and_trait"
source = """
struct Counter(count: i32)

impl Counter {
    fn new(): Counter { Counter(count: 0) }
    fn increment(&mut self) { self.count += 1 }
    fn get(&self): i32 { self.count }
}

trait Resettable {
    fn reset(&mut self)
}

impl Resettable for Counter {
    fn reset(&mut self) { self.count = 0 }
}
"""

[[case]]
name = "generator_iteration"
source = """
gen fn fibonacci(): i64 {
    let mut a = 0
    let mut b = 1
    loop {
        yield a
        let temp = a + b
        a = b
        b = temp
    }
}
"""

[[case]]
name = "enum_with_methods"
source = """
enum Shape {
    Circle(radius: f64),
    Rectangle(width: f64, height: f64),
    Triangle(a: f64, b: f64, c: f64),
}

impl Shape {
    fn area(&self): f64 {
        match self {
            .Circle(r) => 3.14 * r * r,
            .Rectangle(w, h) => w * h,
            .Triangle(a, b, c) => 0.0,
        }
    }
}
"""

