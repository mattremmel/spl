[[case]]
name = "trait_impl_generics_where_methods_patterns"
source = """
trait Container where T {
    fn push(&mut self, item: T)
    fn pop(&mut self): T?
    fn len(&self): i32
}

struct Stack(items: Vec(T: T)) where T

impl Container for Stack where T {
    fn push(&mut self, item: T) {}
    fn pop(&mut self): T? { .None }
    fn len(&self): i32 { 0 }
}

fn use_stack() {
    let mut s = Stack(items: Vec.new())
    s.push(42);
    match s.pop() {
        .Some(v) => v,
        .None => 0,
    }
}
"""

