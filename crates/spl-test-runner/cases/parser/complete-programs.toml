source = """
fn read_data(path: &str): Data throws IoError {
    let file = open(path)!
    let content = file.read()!
    return parse(content)
}

fn main() {
    match read_data("data.txt") {
        .Ok(data) => process(data),
        .Err(e) => log(e),
    }
}
"""

