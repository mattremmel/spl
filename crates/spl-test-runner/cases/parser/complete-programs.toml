[[case]]
name = "match_multiple_arm_types"
source = """
fn categorize(x: i32): String {
    match x {
        0 => "zero",
        1 | 2 | 3 => "small",
        n if n > 100 => "large",
        .Some(v) => "wrapped",
        _ => "other",
    }
}
"""

[[case]]
name = "closure_method_chain"
source = """
fn process(items: Vec(T: i32)): Vec(T: i32) {
    items.filter(|x| x > 0)
         .map(|x| x * 2)
         .collect()
}
"""

[[case]]
name = "labeled_block_break"
source = """
fn find(items: Vec(T: i32)): i32 {
    let result = 'search: {
        for item in items {
            if item > 100 {
                break 'search item
            }
        }
        break 'search -1
    }
    result
}
"""

