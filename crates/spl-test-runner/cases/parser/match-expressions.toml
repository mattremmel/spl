[section]
id = "expr.match"
spec_chapter = "4"
name = "Match Expressions"

[[case]]
name = "match_basic"
source = """
fn f() {
    match x {
        0 => 0,
        1 => 1,
        _ => 2,
    }
}
"""

[[case]]
name = "match_guards"
source = """
fn f() {
    match x {
        n if n > 0 => n,
        _ => 0,
    }
}
"""

[[case]]
name = "match_enum_shorthand"
source = """
fn f() {
    match opt {
        .Some(x) => x,
        .None => 0,
    }
}
"""

[[case]]
name = "match_trailing_comma"
source = """
fn f() {
    match x {
        0 => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "match_nested"
source = """
fn f() {
    match a {
        1 => match b {
            2 => 3,
            _ => 4,
        },
        _ => 5,
    }
}
"""

[[case]]
name = "match_or_pattern"
source = """
fn f() {
    match x {
        1 | 2 | 3 => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "match_struct_pattern"
source = """
fn f() {
    match p {
        Point(x, y) => x + y,
    }
}
"""

[[case]]
name = "match_block_arm"
source = """
fn f() {
    match x {
        0 => {
            let y = 1
            return y
        },
        _ => 0,
    }
}
"""

[[case]]
name = "match_complex_guard"
source = """
fn f() {
    match x {
        n if n > 0 && n < 100 => n,
        _ => 0,
    }
}
"""

[[case]]
name = "match_fully_qualified"
source = """
fn f() {
    match x {
        Option.Some(v) => v,
        Option.None => 0,
    }
}
"""

[[case]]
name = "match_empty"
source = "fn f() { match x {} }"

[[case]]
name = "match_enum_shorthand_or"
source = """
fn f() {
    match x {
        .Some(0) | .None => 0,
        .Some(n) => n,
    }
}
"""

[[case]]
name = "match_range_pattern"
source = """
fn f() {
    match x {
        0..10 => "small",
        10..100 => "medium",
        _ => "large",
    }
}
"""

[[case]]
name = "match_negative_literal"
source = """
fn f() {
    match x {
        -1 => "neg one",
        0 => "zero",
        _ => "other",
    }
}
"""

[[case]]
name = "match_multiple_or_patterns"
source = """
fn f() {
    match x {
        1 | 2 | 3 => "small",
        _ => "other",
    }
}
"""

[[case]]
name = "match_nested_enum_shorthand"
source = """
fn f() {
    match value {
        .Some(.Inner(x)) => x,
        _ => 0,
    }
}
"""

[[case]]
name = "match_guard_with_is"
source = """
fn f() {
    match x {
        n if n is .Some(_) => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "match_on_method_call"
source = """
fn f() {
    match obj.get() {
        .Some(v) => v,
        .None => 0,
    }
}
"""

[[case]]
name = "match_arm_with_block_return"
source = """
fn f() {
    match x {
        0 => { return 0 },
        _ => 1,
    }
}
"""

[[case]]
name = "match_string_patterns"
source = """
fn f() {
    match s {
        "yes" => true,
        "no" => false,
        _ => false,
    }
}
"""

[[case]]
name = "match_multiple_or_with_guard"
source = """
fn f() {
    match x {
        1 | 2 | 3 if x > 1 => true,
        _ => false,
    }
}
"""

[[case]]
name = "match_enum_shorthand_unit_variant"
source = """
fn f() {
    match opt {
        .Some(x) => x,
        .None => 0,
    }
}
"""

[[case]]
name = "match_mixed_arm_types"
source = """
fn f() {
    match x {
        0 => "zero",
        .Some(v) if v > 0 => "positive",
        1 | 2 | 3 => "small",
        _ => "other",
    }
}
"""

[[case]]
name = "match_char_pattern"
source = """
fn f() {
    match ch {
        'a' => 1,
        'b' => 2,
        _ => 0,
    }
}
"""

[[case]]
name = "match_bool_pattern"
source = """
fn f() {
    match flag {
        true => "yes",
        false => "no",
    }
}
"""

[[case]]
name = "match_tuple"
source = """
fn f() {
    match (a, b) {
        (0, 0) => 0,
        (x, y) => x + y,
    }
}
"""

[[case]]
name = "match_wildcard_guard"
source = """
fn f() {
    match x {
        _ if x > 0 => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "match_block_arm_body"
source = """
fn f() {
    match x {
        1 => {
            let y = 2
            y
        },
        _ => 0,
    }
}
"""
