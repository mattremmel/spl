[section]
id = "types.function"
spec_chapter = "2"
name = "Function Types"

[[case]]
name = "fn_type_basic"
source = "type F = fn(i32): bool;"

[[case]]
name = "fn_type_no_return"
source = "type F = fn(i32);"

[[case]]
name = "fn_type_multi_param"
source = "type F = fn(i32, String): bool;"

[[case]]
name = "fn_type_no_params"
source = "type F = fn(): i32;"

[[case]]
name = "fn_type_unit"
source = "type F = fn();"

[[case]]
name = "fn_type_unsafe"
source = "type F = unsafe fn(i32): bool;"

[[case]]
name = "fn_type_extern"
source = """type F = extern "C" fn(i32): i32;"""

[[case]]
name = "fn_type_unsafe_extern"
source = """type F = unsafe extern "C" fn(): i32;"""

[[case]]
name = "fn_type_bare_extern"
source = "type F = extern fn(i32): i32;"

[[case]]
name = "fn_type_unsafe_bare_extern"
source = "type F = unsafe extern fn(): i32;"

[[case]]
name = "fn_type_lifetime_params"
source = "fn f(x: fn('a)(&'a i32): &'a i32) {}"

[[case]]
name = "fn_type_returns_fn"
source = "fn f(x: fn(): fn(): i32) {}"

[[case]]
name = "fn_type_param_fn"
source = "fn f(x: fn(fn(i32): bool): i32) {}"

[[case]]
name = "fn_type_trailing_comma"
source = "fn f(x: fn(i32, bool,): i32) {}"

[[case]]
name = "fn_type_multiple_lifetimes"
source = "fn f(x: fn('a, 'b)(&'a i32, &'b i32): &'a i32) {}"

[[case]]
name = "fn_type_optional_return"
source = "fn f(x: fn(i32): i32?) {}"

[[case]]
name = "fn_type_nested"
source = "fn f(x: fn(fn(i32): i32): bool) {}"

[[case]]
name = "fn_type_unsafe_extern_combo"
source = "fn f(x: unsafe extern \"C\" fn(i32): i32) {}"

[[case]]
name = "fn_type_ref_return"
source = "fn f(cb: fn(&i32): &i32) {}"

[[case]]
name = "fn_type_optional_param"
source = "fn f(cb: fn(i32?): bool) {}"

[[case]]
name = "fn_type_as_generic_arg"
source = "fn f() { let x: Vec(T: fn(i32): bool) = items }"

[[case]]
name = "fn_type_tuple_return"
source = "fn f(cb: fn(i32): (i32, bool)) {}"
