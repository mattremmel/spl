[section]
id = "misc.disambiguation"
spec_chapter = "6"
name = "Disambiguation"

[[case]]
name = "struct_vs_call"
source = """
fn f() {
    Point(x: 1, y: 2)
    add(1, 2)
}
"""

[[case]]
name = "tuple_vs_grouped"
source = """
fn f() {
    let a = (x)
    let b = (x,)
}
"""

[[case]]
name = "generic_parens"
source = "fn f() { let x: Vec(T: i32) = v }"

[[case]]
name = "path_types"
source = "fn f() { let x: std.vec.Vec = v }"

[[case]]
name = "nested_generics"
source = "fn f() { let x: Option(T: Vec(T: i32)) = v }"

[[case]]
name = "method_vs_field"
source = "fn f() { obj.field.method() }"

[[case]]
name = "struct_shorthand_mixed"
source = "fn f() { Point(x, y: y + 1) }"

[[case]]
name = "named_tuple_not_grouped"
source = "fn f() { (x: 1) }"

[[case]]
name = "disambiguation_is_in_while"
source = "fn f() { while x is .Some(v) { v } }"

[[case]]
name = "disambiguation_dollar_in_slice_both"
source = "fn f() { arr[$-2:$-1] }"

[[case]]
name = "disambiguation_for_pattern_complex"
source = "fn f() { for .Some(x) in items {} }"

[[case]]
name = "disambiguation_optional_chain_coalesce"
source = """fn f() { x?.name ?? y?.name ?? "default" }"""

[[case]]
name = "disambiguation_match_block_then_expr_arm"
source = """
fn f() {
    match x {
        1 => {
            do_something()
        }
        2 => "two",
    }
}
"""

# --- Negative tests: case-based disambiguation violations ---

[[case]]
name = "lowercase_type_arg_fails"
source = "fn f() { let x: Vec(t: i32) = v }"
expect_error = "expected"

[[case]]
name = "lowercase_named_value_arg_accepted"
source = "fn f() { add(x: 1, y: 2) }"

[[case]]
name = "uppercase_type_arg_accepted"
source = "fn f() { identity(T: i32, 42) }"

[[case]]
name = "lowercase_value_arg_no_type_syntax"
source = "fn f() { foo(t: 42) }"

[[case]]
name = "mixed_case_args_in_call"
source = "fn f() { convert(From: i32, to: 100) }"

[[case]]
name = "uppercase_ident_colon_is_type_arg"
source = "fn f() { let x: Result(T: i32, E: String) = r }"

[[case]]
name = "lowercase_ident_colon_is_value_arg"
source = "fn f() { Point(x: 1, y: 2) }"

[[case]]
name = "type_arg_shorthand_uppercase_only"
source = "fn f() { Option(T).unwrap() }"

[[case]]
name = "multiple_type_args_uppercase"
source = "fn f() { HashMap(K: String, V: i32).new() }"

[[case]]
name = "value_and_type_args_mixed"
source = "fn f() { process(T: i32, value: 42, U: bool) }"
