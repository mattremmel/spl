[section]
id = "items.type_aliases"
spec_chapter = "1.8"
name = "Type Aliases"

[[case]]
name = "type_simple"
source = "type Int = i32;"

[[case]]
name = "type_generic_params"
source = "type Pair(T) = (T, T) where T"

[[case]]
name = "type_where_bounds"
source = "type CloneBox(T) = i32 where T: Clone"

[[case]]
name = "type_multiple_params"
source = "type Map(K, V) = i32 where K, V"

[[case]]
name = "type_trailing_comma"
source = "type Pair(T,) = (T, T) where T"

[[case]]
name = "type_complex"
source = "type StringMap(V, K) = i32 where V, K: Hash + Eq"

[[case]]
name = "type_missing_eq"
expect_error = "expected"
source = "type Foo i32;"

[[case]]
name = "type_alias_with_semicolon"
source = "type Int = i32;"

[[case]]
name = "type_alias_default"
source = "type MyResult(T, E) = i32 where T, E = Error"

[[case]]
name = "type_alias_bounds_and_default"
source = "type StringMap(V, K) = i32 where V, K: Hash + Eq = String"

[[case]]
name = "type_alias_no_params_no_where"
source = "type Int = i32"

[[case]]
name = "type_alias_multiple_params_mixed"
source = """
type StringMap(V) = HashMap(K: String, V: V) where V: Clone
"""

[[case]]
name = "type_alias_nested_generic"
source = "type NestedOpt(T) = Option(T: Option(T: T)) where T"

[[case]]
name = "type_alias_fn_type"
source = "type Callback = fn(i32, i32): i32"

[[case]]
name = "type_alias_ref_type"
source = "type StrRef = &str"

[[case]]
name = "type_alias_generic_params_bounds_defaults"
source = "type MyResult(T, E) = Result(T: T, E: E) where T, E: Debug = Error"
