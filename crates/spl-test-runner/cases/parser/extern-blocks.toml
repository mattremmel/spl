[section]
id = "items.extern"
spec_chapter = "1.11"
name = "Extern Blocks"

[[case]]
name = "extern_basic"
source = """
extern "C" {
    fn puts(s: i32): i32
}
"""

[[case]]
name = "extern_multiple_fns"
source = """
extern "C" {
    fn malloc(size: i32): i32
    fn free(ptr: i32)
}
"""

[[case]]
name = "extern_return_type"
source = """
extern "C" {
    fn atoi(s: i32): i32
}
"""

[[case]]
name = "extern_variadic"
source = """
extern "C" {
    fn printf(fmt: i32, ...): i32
}
"""

[[case]]
name = "extern_bare_block"
source = """
extern {
    fn puts(s: i32): i32
}
"""

[[case]]
name = "extern_fn_def_no_abi"
source = """
extern fn my_callback(value: i32): i32 {
    return value * 2
}
"""

[[case]]
name = "pub_extern_fn_def"
source = """
pub extern fn exported(x: i32): i32 {
    x
}
"""
