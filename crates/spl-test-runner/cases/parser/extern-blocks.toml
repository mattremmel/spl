[section]
id = "items.extern"
spec_chapter = "1.11"
name = "Extern Blocks"

[[case]]
name = "extern_basic"
source = """
extern "C" {
    fn puts(s: i32): i32
}
"""

[[case]]
name = "extern_multiple_fns"
source = """
extern "C" {
    fn malloc(size: i32): i32
    fn free(ptr: i32)
}
"""

[[case]]
name = "extern_return_type"
source = """
extern "C" {
    fn atoi(s: i32): i32
}
"""

[[case]]
name = "extern_variadic"
source = """
extern "C" {
    fn printf(fmt: i32, ...): i32
}
"""

[[case]]
name = "extern_bare_block"
source = """
extern {
    fn puts(s: i32): i32
}
"""

[[case]]
name = "extern_fn_def_no_abi"
source = """
extern fn my_callback(value: i32): i32 {
    return value * 2
}
"""

[[case]]
name = "pub_extern_fn_def"
source = """
pub extern fn exported(x: i32): i32 {
    x
}
"""

[[case]]
name = "extern_fn_def_with_abi"
source = """
extern "C" fn callback(x: i32): i32 {
    return x
}
"""

[[case]]
name = "extern_block_empty"
source = """extern "C" {}"""

[[case]]
name = "extern_fn_no_params"
source = """
extern {
    fn foo(): i32;
}
"""

[[case]]
name = "extern_variadic_multiple_params"
source = """
extern "C" {
    fn printf(fmt: Ptr(T: u8), ...): i32
}
"""

[[case]]
name = "extern_fn_def_with_body"
source = """extern "C" fn handler(code: i32): i32 { code + 1 }"""

[[case]]
name = "extern_variadic_only"
source = """
extern "C" {
    fn variadic_only(...): i32;
}
"""

[[case]]
name = "extern_fn_multiple_params"
source = """
extern "C" {
    fn multi(a: i32, b: i32, c: i32): i32;
}
"""

[[case]]
name = "extern_fn_return_void"
source = """
extern "C" {
    fn exit(code: i32);
}
"""

[[case]]
name = "extern_attr_on_fn"
source = """
extern "C" {
    #[link_name = "c_foo"]
    fn bar(): i32;
}
"""

[[case]]
name = "extern_multiple_blocks"
source = """
extern "C" {
    fn foo(): i32;
}
extern "C" {
    fn bar(): i32;
}
"""

[[case]]
name = "extern_fn_def_all_features"
source = """pub extern "C" fn callback(x: i32, y: i32): i32 { x + y }"""

[[case]]
name = "extern_link_attr"
source = """
#[link(name = "mylib")]
extern "C" {
    fn init(): i32
}
"""

[[case]]
name = "extern_fn_trailing_comma_params"
source = """
extern "C" {
    fn process(a: i32, b: i32,): i32
}
"""

[[case]]
name = "extern_fn_def_no_mangle"
source = """#[no_mangle] extern "C" fn callback(x: i32): i32 { x }"""

[[case]]
name = "extern_variadic_3_params"
source = """
extern "C" {
    fn snprintf(buf: Ptr(T: u8), size: i32, fmt: Ptr(T: u8), ...): i32
}
"""

[[case]]
name = "extern_fn_def_with_body_and_abi"
source = """extern "C" fn handler(code: i32): i32 {
    let result = code * 2
    result
}"""

[[case]]
name = "extern_multiple_attrs_on_block"
source = """
#[link(name = "mylib")]
#[allow(unused)]
extern "C" {
    fn init(): i32
    fn cleanup()
}
"""

[[case]]
name = "extern_fn_decl_return_no_params"
source = """
extern "C" {
    fn get_errno(): i32
}
"""

[[case]]
name = "extern_fn_decl_no_return_no_params"
source = """
extern "C" {
    fn abort()
}
"""

[[case]]
name = "extern_fn_def_pub_with_attr"
source = """#[no_mangle] pub extern "C" fn exported(x: i32, y: i32): i32 { x + y }"""

[[case]]
name = "extern_bare_fn_def_with_body"
source = """extern fn callback(value: i32): i32 { value + 1 }"""

# --- Negative tests: invalid items inside extern blocks ---

[[case]]
name = "extern_block_struct_invalid"
source = """
extern "C" {
    struct Foo(x: i32)
}
"""
expect_error = "expected"

[[case]]
name = "extern_block_const_invalid"
source = """
extern "C" {
    const X: i32 = 42
}
"""
expect_error = "expected"

[[case]]
name = "extern_block_type_invalid"
source = """
extern "C" {
    type Foo = i32;
}
"""
expect_error = "expected"

[[case]]
name = "extern_block_impl_invalid"
source = """
extern "C" {
    impl Foo {
        fn bar() {}
    }
}
"""
expect_error = "expected"

[[case]]
name = "extern_block_use_invalid"
source = """
extern "C" {
    use std.io
}
"""
expect_error = "expected"
