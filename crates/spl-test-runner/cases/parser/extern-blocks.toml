[section]
id = "items.extern"
spec_chapter = "1.11"
name = "Extern Blocks"

[[case]]
name = "extern_basic"
source = """
extern "C" {
    fn puts(s: i32): i32
}
"""

[[case]]
name = "extern_multiple_fns"
source = """
extern "C" {
    fn malloc(size: i32): i32
    fn free(ptr: i32)
}
"""

[[case]]
name = "extern_return_type"
source = """
extern "C" {
    fn atoi(s: i32): i32
}
"""

[[case]]
name = "extern_variadic"
source = """
extern "C" {
    fn printf(fmt: i32, ...): i32
}
"""

[[case]]
name = "extern_bare_block"
source = """
extern {
    fn puts(s: i32): i32
}
"""

[[case]]
name = "extern_fn_def_no_abi"
source = """
extern fn my_callback(value: i32): i32 {
    return value * 2
}
"""

[[case]]
name = "pub_extern_fn_def"
source = """
pub extern fn exported(x: i32): i32 {
    x
}
"""

[[case]]
name = "extern_fn_def_with_abi"
source = """
extern "C" fn callback(x: i32): i32 {
    return x
}
"""

[[case]]
name = "extern_block_empty"
source = """extern "C" {}"""

[[case]]
name = "extern_fn_no_params"
source = """
extern {
    fn foo(): i32;
}
"""

[[case]]
name = "extern_variadic_multiple_params"
source = """
extern "C" {
    fn printf(fmt: Ptr(T: u8), ...): i32
}
"""

[[case]]
name = "extern_fn_def_with_body"
source = """extern "C" fn handler(code: i32): i32 { code + 1 }"""

[[case]]
name = "extern_variadic_only"
source = """
extern "C" {
    fn variadic_only(...): i32;
}
"""

[[case]]
name = "extern_fn_multiple_params"
source = """
extern "C" {
    fn multi(a: i32, b: i32, c: i32): i32;
}
"""

[[case]]
name = "extern_fn_return_void"
source = """
extern "C" {
    fn exit(code: i32);
}
"""

[[case]]
name = "extern_attr_on_fn"
source = """
extern "C" {
    #[link_name = "c_foo"]
    fn bar(): i32;
}
"""

[[case]]
name = "extern_multiple_blocks"
source = """
extern "C" {
    fn foo(): i32;
}
extern "C" {
    fn bar(): i32;
}
"""

[[case]]
name = "extern_fn_def_all_features"
source = """pub extern "C" fn callback(x: i32, y: i32): i32 { x + y }"""
