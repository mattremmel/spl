[section]
id = "items.const_static"
spec_chapter = "1.2"
name = "Const and Static Definitions"

[[case]]
name = "const_basic"
source = "const MAX_SIZE: i32 = 1024"

[[case]]
name = "static_basic"
source = "static COUNTER: i32 = 0"

[[case]]
name = "static_mut"
source = "static mut GLOBAL: i32 = 0"

[[case]]
name = "const_missing_type"
expect_error = "expected"
source = "const FOO = 42"

[[case]]
name = "const_with_semicolon"
source = "const PI: f64 = 3.14;"

[[case]]
name = "pub_const"
source = "pub const MAX: i32 = 100"

[[case]]
name = "pub_static"
source = "pub static COUNTER: i32 = 0"

[[case]]
name = "const_complex_expr"
source = "const X: i32 = 1 + 2 * 3"

[[case]]
name = "pub_super_const"
source = "pub(super) const Y: i32 = 5"

[[case]]
name = "const_bitshift_expr"
source = "const MASK: u32 = 0xFF << 8"

[[case]]
name = "static_array_type"
source = "static ITEMS: [i32; 3] = [1, 2, 3]"

[[case]]
name = "const_string"
source = """const GREETING: str = "hello" """

[[case]]
name = "const_path_type"
source = "const MAX: config.Limit = 100"

[[case]]
name = "static_generic_type"
source = "static CACHE: Vec(T: i32) = Vec.new()"

[[case]]
name = "const_bool"
source = "const DEBUG: bool = false"

[[case]]
name = "static_with_semicolon"
source = "static INSTANCE: Config = Config.default();"
