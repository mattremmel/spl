# Single expression blocks vs multi-statement

[[case]]
name = "single_expr_block"
source = "fn f() { let x = { 42 } }"

[[case]]
name = "multi_stmt_block"
source = "fn f() { let x = { let a = 1; let b = 2; a + b } }"

# Comments in unusual positions

[[case]]
name = "comment_between_fn_and_name"
source = """
fn /* comment */ foo() {}
"""

[[case]]
name = "comment_in_params"
source = "fn f(/* first */ a: i32, /* second */ b: i32) {}"

[[case]]
name = "comment_in_expr"
source = "fn f() { a + /* plus */ b }"

[[case]]
name = "comment_before_brace"
source = "fn f() /* comment */ {}"

