[section]
id = "misc.edge_cases"
spec_chapter = "0"
name = "Comprehensive Edge Cases"

# Trailing commas everywhere

[[case]]
name = "trailing_comma_fn_params"
source = "fn f(a: i32, b: i32,) {}"

[[case]]
name = "trailing_comma_call_args"
source = "fn f() { foo(1, 2,) }"

[[case]]
name = "trailing_comma_generic_args"
source = "fn f() { let x: Vec(T: i32,) = items }"

[[case]]
name = "trailing_comma_tuple_fields"
source = "fn f() { (1, 2, 3,) }"

[[case]]
name = "trailing_comma_array_elements"
source = "fn f() { [1, 2, 3,] }"

[[case]]
name = "trailing_comma_enum_variants"
source = "enum Color { Red, Green, Blue, }"

[[case]]
name = "trailing_comma_struct_fields"
source = "struct Point(x: i32, y: i32,)"

[[case]]
name = "trailing_comma_where_clause"
source = "fn f(x: T) where T: Clone, {}"

[[case]]
name = "trailing_comma_use_group"
source = "use std.{HashMap, HashSet,}"

[[case]]
name = "trailing_comma_match_arms"
source = """
fn f() {
    match x {
        0 => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "trailing_comma_slice_pattern"
source = "fn f() { let [a, b,] = arr }"

[[case]]
name = "trailing_comma_closure_params"
source = "fn f() { |a: i32, b: i32,| a + b }"

[[case]]
name = "trailing_comma_capture_list"
source = "fn f() { @[x, y,] || x + y }"

