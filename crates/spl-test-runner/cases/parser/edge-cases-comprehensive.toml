# Misc edge cases

[[case]]
name = "deeply_nested_blocks"
source = """
fn f() {
    { { { { 42 } } } }
}
"""

[[case]]
name = "max_nesting_if"
source = "fn f() { if a { if b { if c { if d { 1 } } } } }"

[[case]]
name = "chained_method_calls_long"
source = "fn f() { a.b().c().d().e().f().g() }"

[[case]]
name = "mixed_items_and_exprs_in_block"
source = """
fn f() {
    struct Local(x: i32)
    let p = Local(x: 42)
    p.x
}
"""

[[case]]
name = "multiple_where_params_with_bounds_and_defaults"
source = "fn f(a: A, b: B, c: C) where A: Clone + Debug, B = i32, C: Send + Sync = String {}"

[[case]]
name = "fn_with_all_clause_types"
source = """
pub const unsafe fn complex(from x: T, _ y: f64 = 1.0): Output throws ConvertError where T: Clone + Debug, Output {
    x
}
"""

