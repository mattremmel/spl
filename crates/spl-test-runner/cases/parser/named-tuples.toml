[section]
id = "types.tuples.named"
spec_chapter = "2.5"
name = "Named Tuples"

[[case]]
name = "named_tuple_type_simple"
source = "fn f(p: (x: i32, y: i32)) {}"

[[case]]
name = "named_tuple_type_mixed"
source = "fn f(p: (i32, name: String)) {}"

[[case]]
name = "named_tuple_expr_simple"
source = "fn f() { (x: 1, y: 2) }"

[[case]]
name = "named_tuple_expr_mixed"
source = """fn f() { (1, name: "hello") }"""

[[case]]
name = "named_tuple_in_fn_return"
source = "fn divide(a: i32, b: i32): (quotient: i32, remainder: i32) { (quotient: a / b, remainder: a % b) }"

[[case]]
name = "named_tuple_field_access"
source = """
fn f() {
    let t = (x: 1, y: 2)
    t.x
    t.0
}
"""

[[case]]
name = "named_tuple_single_element"
source = "fn f() { (x: 1) }"

[[case]]
name = "named_tuple_optional_field_type"
source = "fn f(p: (x: i32?, y: i32)) {}"

[[case]]
name = "named_tuple_generic_field_type"
source = "fn f(p: (items: Vec(T: i32), count: i32)) {}"

[[case]]
name = "named_tuple_as_param_and_return"
source = "fn f(p: (x: i32, y: i32)): (sum: i32, product: i32) {}"

[[case]]
name = "named_tuple_trailing_comma"
source = "fn f() { let x: (x: i32, y: i32,) = val }"

[[case]]
name = "named_tuple_ref_field"
source = "fn f() { let x: (x: &i32, y: &mut i32) = val }"

[[case]]
name = "named_tuple_nested"
source = "fn f() { let x: (pos: (x: f64, y: f64), color: i32) = val }"

[[case]]
name = "named_tuple_single_named"
source = "fn f() { let x: (value: i32) = val }"

[[case]]
name = "named_tuple_fn_type_field"
source = "fn f(p: (callback: fn(i32): bool, count: i32)) {}"

[[case]]
name = "named_tuple_deeply_nested"
source = "fn f(x: (a: (b: (c: i32, d: bool), e: String), f: i32)) {}"

[[case]]
name = "named_tuple_with_optional_fields"
source = "fn f(x: (name: String?, age: i32?)) {}"

[[case]]
name = "named_tuple_in_let"
source = "fn f() { let p: (x: i32, y: i32) = (x: 1, y: 2) }"

[[case]]
name = "named_tuple_expr_trailing_comma"
source = "fn f() { (x: 1, y: 2,) }"

# Named tuple edge cases

[[case]]
name = "named_tuple_in_fn_return_type"
source = "fn f(): (x: i32, y: i32) {}"

[[case]]
name = "named_tuple_in_fn_param_type"
source = "fn f(point: (x: i32, y: i32)) {}"

[[case]]
name = "named_tuple_destructure_positional"
source = "fn f() { let (a, b) = named_tuple }"

[[case]]
name = "empty_tuple_unit"
source = "fn f() { () }"

[[case]]
name = "named_and_positional_in_type"
source = "fn f(x: (i32, name: String)) {}"

[[case]]
name = "named_tuple_method_call"
source = """
fn f() {
    let t = (x: 1, y: 2)
    t.x
}
"""

[[case]]
name = "named_tuple_nested_in_array"
source = "fn f() { [(x: 1, y: 2), (x: 3, y: 4)] }"

[[case]]
name = "named_tuple_as_fn_arg"
source = "fn f() { process((x: 1, y: 2)) }"
