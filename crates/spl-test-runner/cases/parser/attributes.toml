[section]
id = "items.attributes"
spec_chapter = "1.1"
name = "Attributes"

[[case]]
name = "attr_simple"
source = "#[test] fn foo() {}"

[[case]]
name = "attr_dotted_path"
source = "#[cfg.test] fn foo() {}"

[[case]]
name = "attr_with_args"
source = "#[derive(Clone, Copy)] struct Point(x: i32)"

[[case]]
name = "attr_key_value"
source = """#[doc = "hello"] fn foo() {}"""

[[case]]
name = "attr_nested"
source = "#[cfg(target_os = \"linux\")] fn foo() {}"

[[case]]
name = "attr_trailing_comma"
source = "#[derive(Clone,)] struct Foo()"

[[case]]
name = "attr_inner"
source = """
#![allow(unused)]
fn foo() {}
"""

[[case]]
name = "attr_on_struct"
source = "#[repr(C)] struct Data(x: i32, y: i32)"

[[case]]
name = "attr_multiple"
source = """
#[inline]
#[no_mangle]
fn foo() {}
"""

[[case]]
name = "attr_unclosed"
expect_error = "expected"
source = "#[test fn foo() {}"

[[case]]
name = "attr_on_enum"
source = "#[repr(u8)] enum Color { Red, Green, Blue }"

[[case]]
name = "attr_on_trait"
source = """
#[deprecated]
trait Foo {
    fn bar(&self)
}
"""

[[case]]
name = "attr_on_impl"
source = """
#[cfg(test)]
impl Foo {
    fn bar() {}
}
"""

[[case]]
name = "attr_on_const"
source = "#[allow(unused)] const X: i32 = 0"

[[case]]
name = "attr_on_use"
source = "#[cfg(test)] use std.io"

[[case]]
name = "attr_on_module"
source = """
#[cfg(test)]
module test_mod {
    fn helper() {}
}
"""

[[case]]
name = "inner_attr_multiple"
source = """
#![allow(unused)]
#![feature(test)]
fn foo() {}
"""

[[case]]
name = "attr_link"
source = """
#[link(name = "foo")]
extern {
    fn bar(): i32;
}
"""
