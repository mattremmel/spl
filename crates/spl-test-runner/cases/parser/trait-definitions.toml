[section]
id = "items.traits"
spec_chapter = "1.6"
name = "Trait Definitions"

[[case]]
name = "trait_basic"
source = """
trait Clone {
    fn clone(&self): Self
}
"""

[[case]]
name = "trait_associated_type"
source = """
trait Iterator {
    type Item
    fn next(&mut self): i32
}
"""

[[case]]
name = "trait_assoc_type_bounds"
source = """
trait Collection {
    type Item: Clone
}
"""

[[case]]
name = "trait_supertraits"
source = """
trait Numeric: Add + Sub {
    fn zero(): Self
}
"""

[[case]]
name = "trait_where_clause"
source = """
trait Container where T: Clone {
    fn get(&self): i32
}
"""

[[case]]
name = "trait_default_method"
source = """
trait Default {
    fn default(): Self {
        return Self()
    }
}
"""

[[case]]
name = "trait_unsafe"
source = """
unsafe trait Send {
    fn check(&self): bool
}
"""

[[case]]
name = "trait_empty"
source = "trait Marker {}"

[[case]]
name = "trait_multiple_supertraits_3plus"
source = """
trait Numeric: Add + Sub + Mul + Div {
    fn zero(): Self
}
"""

[[case]]
name = "trait_unsafe_method"
source = """
unsafe trait Foo {
    unsafe fn danger(&self)
}
"""

[[case]]
name = "trait_const_method"
source = """
trait Foo {
    const fn compute(): i32;
}
"""

[[case]]
name = "trait_pub_item"
source = """
trait Foo {
    pub fn bar(&self);
}
"""

[[case]]
name = "trait_method_throws"
source = """
trait Foo {
    fn read(&self): i32 throws Error;
}
"""

[[case]]
name = "trait_method_where"
source = """
trait Foo {
    fn convert(&self): i32 where U;
}
"""

[[case]]
name = "trait_multiple_assoc_types"
source = """
trait Foo {
    type Item;
    type Error;
}
"""

[[case]]
name = "trait_assoc_type_multiple_bounds"
source = """
trait Foo {
    type Item: Clone + Debug;
}
"""

[[case]]
name = "trait_default_type_param"
source = """
trait Add where RHS = Self {
    fn add(self): Self
}
"""

[[case]]
name = "trait_method_with_default_body"
source = """
trait Describable {
    fn describe(&self): String { "unknown".to_string() }
}
"""

[[case]]
name = "trait_where_with_default"
source = """
trait Add where RHS = Self {
    type Output
    fn add(&self, rhs: RHS): Self.Output
}
"""

[[case]]
name = "trait_supertrait_and_where"
source = """
trait Foo: Clone where T: Debug {
    fn bar(&self)
}
"""

[[case]]
name = "trait_assoc_type_with_bounds_default"
source = """
trait Foo {
    type Output: Clone
}
"""

[[case]]
name = "trait_multiple_methods_semicolons"
source = """
trait Foo {
    fn a(&self)
    fn b(&self): i32
    fn c(&mut self)
}
"""

[[case]]
name = "trait_unsafe_fn_in_trait"
source = """
trait Foo {
    unsafe fn dangerous(&self)
}
"""

[[case]]
name = "trait_method_default_body_and_where"
source = """
trait Converter {
    fn convert(&self): U where U: From(T: Self) {
        U.from(self)
    }
}
"""

[[case]]
name = "trait_method_returning_self_assoc"
source = """
trait Iterator {
    type Item
    fn next(&mut self): Self.Item
}
"""

[[case]]
name = "trait_method_returning_optional_assoc"
source = """
trait Iterator {
    type Item
    fn try_next(&mut self): Self.Item?
}
"""

[[case]]
name = "trait_method_with_generic_using_assoc"
source = """
trait Collection {
    type Item
    fn items(&self): Vec(T: Self.Item)
}
"""

[[case]]
name = "trait_where_mixed_bounds_defaults"
source = """
trait Convert where T: Clone, U: Debug = String {
    fn convert(&self): U
}
"""

[[case]]
name = "trait_gen_fn_method"
expect_error = "expected"
source = """
trait Producer {
    gen fn items(&self): i32
}
"""

[[case]]
name = "trait_supertrait_where_default"
source = """
trait Foo: Clone where T: Debug = String {
    fn process(&self): T { self.clone() }
}
"""

[[case]]
name = "trait_unsafe_method_throws"
source = """
trait Dangerous {
    unsafe fn risky(&self): i32 throws Error
}
"""
