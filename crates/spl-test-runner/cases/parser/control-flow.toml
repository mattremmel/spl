[section]
id = "expr.control_flow"
spec_chapter = "4.5"
name = "Control Flow Expressions"

[[case]]
name = "if_basic"
source = "fn f() { if true { 1 } }"

[[case]]
name = "if_else"
source = "fn f() { if true { 1 } else { 0 } }"

[[case]]
name = "if_else_if"
source = "fn f() { if a { 1 } else if b { 2 } else { 3 } }"

[[case]]
name = "while_basic"
source = "fn f() { while true { x = x + 1 } }"

[[case]]
name = "for_basic"
source = "fn f() { for x in items { process(x) } }"

[[case]]
name = "for_pattern"
source = "fn f() { for (a, b) in pairs { use_pair(a, b) } }"

[[case]]
name = "loop_basic"
source = "fn f() { loop { break } }"

[[case]]
name = "break_value"
source = "fn f() { loop { break 42 } }"

[[case]]
name = "continue_basic"
source = "fn f() { while true { continue } }"

[[case]]
name = "return_value"
source = "fn f(): i32 { return 42 }"

[[case]]
name = "return_void"
source = "fn f() { return }"

[[case]]
name = "labeled_loop"
source = "fn f() { 'outer: loop { break } }"

[[case]]
name = "labeled_while"
source = "fn f() { 'outer: while true { continue 'outer } }"

[[case]]
name = "labeled_for"
source = "fn f() { 'outer: for x in items { break 'outer } }"

[[case]]
name = "labeled_block"
source = "fn f() { 'calc: { break 'calc 42 } }"

[[case]]
name = "break_with_label"
source = "fn f() { 'x: loop { break 'x } }"

[[case]]
name = "break_label_value"
source = "fn f() { 'x: loop { break 'x 42 } }"

[[case]]
name = "continue_with_label"
source = "fn f() { 'x: while true { continue 'x } }"

[[case]]
name = "nested_labeled_loops"
source = """
fn f() {
    'outer: for x in a {
        'inner: for y in b {
            break 'outer
        }
    }
}
"""

[[case]]
name = "for_range"
source = "fn f() { for i in 0..10 { i } }"

[[case]]
name = "while_is_pattern"
source = "fn f() { while x is .Some(v) { v } }"

[[case]]
name = "if_is_pattern"
source = "fn f() { if x is .Some(v) { v } }"

[[case]]
name = "yield_standalone"
source = "gen fn f(): i32 { yield 42 }"

[[case]]
name = "throw_expr"
source = "fn f() throws { throw err }"

[[case]]
name = "unsafe_block"
source = "fn f() { unsafe { danger() } }"

[[case]]
name = "while_is_pattern_complex"
source = """
fn f() {
    while queue.pop() is .Some(item) {
        process(item)
    }
}
"""

[[case]]
name = "if_is_and_condition"
source = """
fn f() {
    if value is .Some(x) && x > 0 {
        use_value(x)
    }
}
"""

[[case]]
name = "for_tuple_pattern"
source = """
fn f() {
    for (key, value) in items {
        process(key, value)
    }
}
"""

[[case]]
name = "loop_break_with_value"
source = """
fn f() {
    let result = loop {
        break 42
    }
}
"""

[[case]]
name = "labeled_block_break_value"
source = """
fn f() {
    let v = 'block: {
        break 'block 42
    }
}
"""

[[case]]
name = "if_as_expression"
source = "fn f() { let x = if true { 1 } else { 0 } }"

[[case]]
name = "for_tuple_destructure"
source = "fn f() { for (a, b) in pairs {} }"

[[case]]
name = "while_is_pattern_pop"
source = "fn f() { while stack.pop() is .Some(item) {} }"

[[case]]
name = "loop_labeled_break_expr"
source = "fn f() { let x = 'l: loop { break 'l 1 + 2 } }"

[[case]]
name = "nested_labeled_loops_break"
source = """
fn f() {
    'a: for x in xs {
        'b: for y in ys {
            break 'a
        }
    }
}
"""

[[case]]
name = "labeled_block_with_complex_break"
source = """
fn f() {
    let result = 'block: {
        if cond {
            break 'block val1
        } else {
            break 'block val2
        }
    }
}
"""

[[case]]
name = "for_complex_pattern"
source = "fn f() { for (key, value) in map.entries() {} }"

[[case]]
name = "labeled_for_break_value"
source = "fn f() { let x = 'outer: for item in items { break 'outer item } }"

[[case]]
name = "nested_labeled_loops_continue"
source = """
fn f() {
    'a: loop {
        'b: loop {
            continue 'a
        }
    }
}
"""

[[case]]
name = "if_else_if_chain"
source = "fn f() { if a { 1 } else if b { 2 } else if c { 3 } else { 4 } }"

[[case]]
name = "if_is_as_value"
source = "fn f() { let x = if v is .Some(val) { val } else { 0 } }"

[[case]]
name = "for_enum_shorthand_pattern"
source = "fn f() { for .Some(item) in items { process(item) } }"

[[case]]
name = "nested_labeled_loops_3_deep"
source = """
fn f() {
    'a: loop {
        'b: for x in items {
            'c: while cond {
                break 'a
            }
        }
    }
}
"""

[[case]]
name = "while_is_with_method_call"
source = "fn f() { while iter.next() is .Some(item) { process(item) } }"

[[case]]
name = "loop_break_with_complex_value"
source = """
fn f() {
    let result = loop {
        if done {
            break compute() + 1
        }
    }
}
"""

[[case]]
name = "for_range_inclusive"
source = "fn f() { for i in 0..=100 {} }"

[[case]]
name = "for_slice_pattern"
source = "fn f() { for [a, b] in pairs {} }"

[[case]]
name = "throw_in_if"
source = """
fn f() throws {
    if error {
        throw .BadRequest("invalid")
    }
}
"""

[[case]]
name = "yield_in_for"
source = """
gen fn flatten(lists: [[i32]]): i32 {
    for list in lists {
        for item in list {
            yield item
        }
    }
}
"""
