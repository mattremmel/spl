[section]
id = "items.visibility"
spec_chapter = "1.1"
name = "Visibility Modifiers"

[[case]]
name = "vis_pub"
source = "pub fn foo() {}"

[[case]]
name = "vis_pub_super"
source = "pub(super) fn internal() {}"

[[case]]
name = "vis_pub_package"
source = "pub($) fn package_fn() {}"

[[case]]
name = "vis_pub_package_path"
source = "pub($.path) fn scoped_fn() {}"

[[case]]
name = "vis_pub_fields"
source = "pub struct Point(pub x: i32, pub y: i32)"

[[case]]
name = "vis_pub_on_trait_items"
source = """
trait Foo {
    pub fn bar(&self);
}
"""

[[case]]
name = "vis_pub_on_impl_items"
source = """
impl Foo {
    pub fn bar(&self) {}
}
"""

[[case]]
name = "vis_pub_package_on_field"
source = "struct Foo(pub($) x: i32)"

[[case]]
name = "vis_pub_package_path_on_field"
source = "struct Foo(pub($.internal) x: i32)"

[[case]]
name = "vis_pub_static_mut"
source = "pub static mut COUNTER: i32 = 0"

[[case]]
name = "pub_const"
source = "pub const MAX: i32 = 100"

[[case]]
name = "pub_enum"
source = "pub enum Color { Red, Green, Blue }"

[[case]]
name = "pub_type_alias"
source = "pub type Result(T) = i32"

[[case]]
name = "pub_dollar_on_struct"
source = "pub($) struct Internal(x: i32)"

[[case]]
name = "pub_dollar_on_enum"
source = "pub($) enum CrateEnum { A, B }"

[[case]]
name = "pub_dollar_on_trait"
source = """
pub($) trait InternalTrait {
    fn method(&self)
}
"""

[[case]]
name = "pub_dollar_on_const"
source = "pub($) const INTERNAL: i32 = 42"

[[case]]
name = "pub_dollar_on_static"
source = "pub($) static COUNTER: i32 = 0"

[[case]]
name = "pub_dollar_on_use"
source = "pub($) use internal.Helper"

[[case]]
name = "pub_dollar_on_module"
source = "pub($) module internal { fn helper() {} }"

[[case]]
name = "pub_dollar_deep_path"
source = "pub($.path.to.module) fn scoped() {}"

[[case]]
name = "pub_super_on_struct"
source = "pub(super) struct ParentVisible(x: i32)"

[[case]]
name = "pub_on_impl_method"
source = """
impl Foo {
    pub fn public(&self) {}
    pub(super) fn semi_public(&self) {}
    pub($) fn crate_public(&self) {}
}
"""

# --- Negative tests: invalid visibility syntax ---

[[case]]
name = "pub_invalid_scope_keyword"
source = "pub(invalid) fn foo() {}"
expect_error = "expected"

[[case]]
name = "pub_super_super_duplicate"
source = "pub(super super) fn foo() {}"
expect_error = "expected"

[[case]]
name = "double_pub_visibility"
source = "pub pub fn foo() {}"
expect_error = "expected"

[[case]]
name = "pub_dollar_missing_close_paren"
source = "pub($ fn foo() {}"
expect_error = "expected"

[[case]]
name = "pub_nested_parens"
source = "pub((super)) fn foo() {}"
expect_error = "expected"
