[section]
id = "expr.misc"
spec_chapter = "4"
name = "Miscellaneous Expressions"

[[case]]
name = "return_expr"
source = "fn f(): i32 { return 42 }"

[[case]]
name = "return_void_expr"
source = "fn f() { return }"

[[case]]
name = "yield_expr"
source = "gen fn g(): i32 { yield 1 }"

[[case]]
name = "throw_expr"
source = "fn f() throws { throw err }"

[[case]]
name = "try_expr"
source = "fn f() { x! }"

[[case]]
name = "is_expr"
source = "fn f() { if x is .Some(v) { v } }"

[[case]]
name = "unsafe_block"
source = "fn f() { unsafe { danger() } }"

[[case]]
name = "range_exclusive"
source = "fn f() { 0..10 }"

[[case]]
name = "range_inclusive"
source = "fn f() { 0..=10 }"

[[case]]
name = "grouped_expr"
source = "fn f() { (a + b) * c }"

[[case]]
name = "block_expr"
source = """
fn f() {
    let x = { 42 }
}
"""

[[case]]
name = "assignment_to_field"
source = "fn f() { obj.field = 1 }"

[[case]]
name = "assignment_to_index"
source = "fn f() { arr[0] = 1 }"

[[case]]
name = "assignment_right_assoc"
source = "fn f() { a = b = 1 }"

[[case]]
name = "all_compound_assigns"
source = "fn f() { x -= 1; x *= 2; x /= 3; x %= 4; x &= 0xFF; x |= 1; x ^= 2; x <<= 1; x >>= 1 }"

[[case]]
name = "chained_unary"
source = "fn f() { !!a }"

[[case]]
name = "ref_mut_expr"
source = "fn f() { &mut x }"
