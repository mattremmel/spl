[section]
id = "types.special"
spec_chapter = "2"
name = "Special Types"

[[case]]
name = "never_type"
source = "fn diverge(): Never { loop {} }"

[[case]]
name = "optional_type"
source = "fn foo(x: i32?) {}"

[[case]]
name = "ref_optional"
source = "fn foo(x: &i32?) {}"

[[case]]
name = "never_in_let"
source = "fn f() { let x: Never = loop {} }"

[[case]]
name = "never_as_generic_arg"
source = "fn f(x: Result(T: Never, E: Error)) {}"

[[case]]
name = "never_in_array"
source = "fn f(x: [Never; 0]) {}"

[[case]]
name = "optional_complex_type"
source = "fn f(x: Vec(T: i32)?) {}"

[[case]]
name = "optional_on_fn_type"
source = "fn f(x: fn(): i32?) {}"

[[case]]
name = "optional_on_ref"
source = "fn f(x: &i32?) {}"

[[case]]
name = "never_in_result"
source = "fn f(x: Result(T: i32, E: Never)) {}"

[[case]]
name = "optional_nested"
source = "fn f() { let x: Option(T: i32)? = .Some(.Some(1)) }"

[[case]]
name = "optional_ref_to_optional"
source = "fn f() { let x: &String? = r }"

[[case]]
name = "optional_fn_type"
source = "fn f() { let x: fn(i32): bool? = cb }"

[[case]]
name = "optional_path_type"
source = "fn f() { let x: std.io.Result? = r }"

[[case]]
name = "never_in_fn_return"
source = "fn abort(): Never { loop {} }"

[[case]]
name = "never_in_tuple"
source = "fn f(x: (Never, i32)) {}"

[[case]]
name = "never_ref"
source = "fn f(x: &Never) {}"

[[case]]
name = "optional_on_self"
source = """
impl Foo {
    fn maybe(): Self? { .Some(Self(x: 1)) }
}
"""

[[case]]
name = "optional_double"
source = "fn f(x: i32??) {}"

[[case]]
name = "optional_triple"
source = "fn f(x: i32???) {}"

[[case]]
name = "optional_on_tuple"
source = "fn f(x: (i32, bool)?) {}"

[[case]]
name = "optional_on_array"
source = "fn f(x: [i32; 10]?) {}"

[[case]]
name = "optional_on_slice"
source = "fn f(x: [i32]?) {}"

[[case]]
name = "extern_c_fn_standalone_type"
source = """fn f(cb: extern "C" fn(i32): i32) {}"""

[[case]]
name = "extern_bare_fn_standalone_type"
source = "fn f(cb: extern fn(i32): i32) {}"

[[case]]
name = "unsafe_extern_c_fn_standalone_type"
source = """fn f(cb: unsafe extern "C" fn(i32): i32) {}"""
