[section]
id = "types.special"
spec_chapter = "2"
name = "Special Types"

[[case]]
name = "never_type"
source = "fn diverge(): Never { loop {} }"

[[case]]
name = "optional_type"
source = "fn foo(x: i32?) {}"

[[case]]
name = "ref_optional"
source = "fn foo(x: &i32?) {}"

[[case]]
name = "never_in_let"
source = "fn f() { let x: Never = loop {} }"

[[case]]
name = "never_as_generic_arg"
source = "fn f(x: Result(T: Never, E: Error)) {}"

[[case]]
name = "never_in_array"
source = "fn f(x: [Never; 0]) {}"

[[case]]
name = "optional_complex_type"
source = "fn f(x: Vec(T: i32)?) {}"

[[case]]
name = "optional_on_fn_type"
source = "fn f(x: fn(): i32?) {}"

[[case]]
name = "optional_on_ref"
source = "fn f(x: &i32?) {}"

[[case]]
name = "never_in_result"
source = "fn f(x: Result(T: i32, E: Never)) {}"
