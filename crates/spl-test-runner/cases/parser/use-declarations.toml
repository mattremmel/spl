[section]
id = "items.use"
spec_chapter = "1.9"
name = "Use Declarations"

[[case]]
name = "use_simple"
source = "use std.vec.Vec"

[[case]]
name = "use_rename"
source = "use std.collections.HashMap as Map"

[[case]]
name = "use_glob"
source = "use std.prelude.*"

[[case]]
name = "use_grouped"
source = "use std.collections.{HashMap, HashSet}"

[[case]]
name = "use_nested_group"
source = "use std.{vec.Vec, io.{Read, Write}}"

[[case]]
name = "use_self_super"
source = "use super.common"

[[case]]
name = "use_missing_path"
expect_error = "expected"
source = "use"

[[case]]
name = "use_package_root"
source = "use $.utils.helper"

[[case]]
name = "use_self_path"
source = "use self.helper"

[[case]]
name = "use_grouped_with_rename"
source = "use std.{HashMap as Map, HashSet}"

[[case]]
name = "use_trailing_comma_group"
source = "use std.{HashMap, HashSet,}"

[[case]]
name = "use_deeply_nested"
source = "use a.b.c.d.e.f"

[[case]]
name = "use_deeply_nested_groups"
source = "use std.{io.{Read, Write}, collections.{HashMap, HashSet}}"

[[case]]
name = "use_group_with_glob"
source = "use std.io.{Read, *}"

[[case]]
name = "use_renamed_grouped"
source = "use std.collections.{HashMap as Map, HashSet as Set}"
