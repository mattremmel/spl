[[case]]
name = "let_struct_pattern_with_rest"
source = "fn f() { let Point(x, ...) = p }"

[[case]]
name = "let_tuple_three"
source = "fn f() { let (a, b, c) = triple }"

[[case]]
name = "let_empty_tuple"
source = "fn f() { let () = unit_val }"

[[case]]
name = "let_complex_type_annotation"
source = "fn f() { let x: HashMap(K: String, V: Vec(T: i32)) = items }"

