[section]
id = "items.generators"
spec_chapter = "1.3"
name = "Generator Definitions"

[[case]]
name = "gen_basic"
source = """
gen fn count(): i32 {
    yield 1
    yield 2
}
"""

[[case]]
name = "gen_with_params_where"
source = """
gen fn items(list: T): T where T {
    yield list
}
"""

[[case]]
name = "gen_throws"
source = """
gen fn fallible(): i32 throws {
    yield 1
}
"""

[[case]]
name = "gen_missing_fn"
expect_error = "expected"
source = "gen count() {}"

[[case]]
name = "gen_fn_typed_throws"
source = """
gen fn foo(): i32 throws Error {
    yield 0
}
"""

[[case]]
name = "gen_fn_throws_where"
source = """
gen fn foo(): i32 throws where T {
    yield 0
}
"""

[[case]]
name = "gen_fn_no_params"
source = """
gen fn empty(): i32 {
    yield 0
}
"""

[[case]]
name = "gen_fn_labeled_param"
source = "gen fn items(from start: i32): i32 { yield start }"

[[case]]
name = "gen_fn_default_param"
source = "gen fn range(start: i32 = 0): i32 { yield start }"

[[case]]
name = "gen_fn_self_param"
source = """
impl Foo {
    gen fn iter(&self): i32 { yield 0 }
}
"""

[[case]]
name = "gen_fn_multiple_yields"
source = """
gen fn count(): i32 {
    yield 1
    yield 2
    yield 3
}
"""

[[case]]
name = "gen_fn_yield_in_loop"
source = """
gen fn repeat(): i32 {
    loop {
        yield 42
    }
}
"""

[[case]]
name = "gen_fn_yield_conditional"
source = """
gen fn filtered(): i32 {
    for x in items {
        if x > 0 {
            yield x
        }
    }
}
"""

[[case]]
name = "gen_fn_all_clauses_combined"
source = """
gen fn transform(from input: T, scale: f64 = 1.0): Output throws ConvertError where T: Clone, Output {
    yield input
}
"""

[[case]]
name = "gen_fn_mut_self"
source = """
impl Collection {
    gen fn drain(&mut self): i32 { yield 0 }
}
"""

[[case]]
name = "gen_fn_pub"
source = "pub gen fn items(): i32 { yield 1 }"

[[case]]
name = "gen_fn_pub_in_impl"
source = """
impl Foo {
    pub gen fn values(&self): i32 { yield 0 }
}
"""

[[case]]
name = "gen_fn_where_with_bounds_and_default"
source = "gen fn items(): T throws Error where T: Clone = i32 { yield T.default() }"

[[case]]
name = "gen_fn_nested_yield_in_match"
source = """
gen fn process(): i32 {
    match state {
        .Ready => yield 1,
        .Done => yield 2,
        _ => yield 0,
    }
}
"""

[[case]]
name = "gen_fn_attributed"
source = """
#[inline]
gen fn numbers(): i32 {
    yield 1
    yield 2
}
"""

[[case]]
name = "gen_fn_complex_return_type"
source = "gen fn items(): Option(T: i32) { yield .Some(42) }"

[[case]]
name = "gen_fn_multiple_params"
source = "gen fn range(from start: i32, to end: i32): i32 { yield start }"
