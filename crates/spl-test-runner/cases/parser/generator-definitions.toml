[section]
id = "items.generators"
spec_chapter = "1.3"
name = "Generator Definitions"

[[case]]
name = "gen_basic"
source = """
gen fn count(): i32 {
    yield 1
    yield 2
}
"""

[[case]]
name = "gen_with_params_where"
source = """
gen fn items(list: T): T where T {
    yield list
}
"""

[[case]]
name = "gen_throws"
source = """
gen fn fallible(): i32 throws {
    yield 1
}
"""

[[case]]
name = "gen_missing_fn"
expect_error = "expected"
source = "gen count() {}"

[[case]]
name = "gen_fn_typed_throws"
source = """
gen fn foo(): i32 throws Error {
    yield 0
}
"""

[[case]]
name = "gen_fn_throws_where"
source = """
gen fn foo(): i32 throws where T {
    yield 0
}
"""

[[case]]
name = "gen_fn_no_params"
source = """
gen fn empty(): i32 {
    yield 0
}
"""

[[case]]
name = "gen_fn_labeled_param"
source = "gen fn items(from start: i32): i32 { yield start }"

[[case]]
name = "gen_fn_default_param"
source = "gen fn range(start: i32 = 0): i32 { yield start }"

[[case]]
name = "gen_fn_self_param"
source = """
impl Foo {
    gen fn iter(&self): i32 { yield 0 }
}
"""
