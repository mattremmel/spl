[section]
id = "items.generators"
spec_chapter = "1.3"
name = "Generator Definitions"

[[case]]
name = "gen_basic"
source = """
gen fn count(): i32 {
    yield 1
    yield 2
}
"""

[[case]]
name = "gen_with_params_where"
source = """
gen fn items(list: T): T where T {
    yield list
}
"""

[[case]]
name = "gen_throws"
source = """
gen fn fallible(): i32 throws {
    yield 1
}
"""

[[case]]
name = "gen_missing_fn"
expect_error = "expected"
source = "gen count() {}"
