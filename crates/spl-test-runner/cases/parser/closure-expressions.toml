[section]
id = "expr.closures"
spec_chapter = "4"
name = "Closure Expressions"

[[case]]
name = "closure_basic"
source = "fn f() { |x| x + 1 }"

[[case]]
name = "closure_empty_params"
source = "fn f() { || 42 }"

[[case]]
name = "closure_block_body"
source = """
fn f() {
    |x| {
        let y = x + 1
        return y
    }
}
"""

[[case]]
name = "closure_typed_params"
source = "fn f() { |x: i32| x + 1 }"

[[case]]
name = "closure_multi_params"
source = "fn f() { |a, b| a + b }"

[[case]]
name = "closure_capture_simple"
source = "fn f() { @[x] |y| x + y }"

[[case]]
name = "closure_capture_expr"
source = "fn f() { @[x: &x] || x }"

[[case]]
name = "closure_capture_multiple"
source = "fn f() { @[x, y: &y] |z| x + y + z }"

[[case]]
name = "closure_capture_empty"
source = "fn f() { @[] || 42 }"

[[case]]
name = "closure_mut_param"
source = "fn f() { |mut x: i32| x }"

[[case]]
name = "closure_trailing_comma"
source = "fn f() { |a: i32, b: i32,| a + b }"

[[case]]
name = "closure_block_multi_stmt"
source = """
fn f() {
    let add = |a: i32, b: i32| {
        let sum = a + b
        sum
    }
}
"""

[[case]]
name = "closure_capture_by_ref"
source = """fn f() { let c = @[x: &x]|y| x + y }"""

[[case]]
name = "closure_as_argument"
source = """fn f() { items.map(|x| x + 1) }"""

[[case]]
name = "closure_nested"
source = """fn f() { let f = |x| |y| x + y }"""

[[case]]
name = "closure_in_method_chain"
source = "fn f() { items.filter(|x| x > 0).map(|x| x * 2) }"

[[case]]
name = "closure_capture_ref"
source = "fn f() { @[x: &x] |y| x + y }"

[[case]]
name = "closure_empty_capture"
source = "fn f() { @[] |x| x + 1 }"

[[case]]
name = "closure_multi_capture_mixed"
source = "fn f() { @[a, b: &b] || a + b }"

[[case]]
name = "closure_capture_with_clone_expr"
source = "fn f() { @[x: &x, y: clone(y)] |z| x + y + z }"

[[case]]
name = "closure_nested_in_closure"
source = """
fn f() {
    let outer = |x| {
        let inner = |y| x + y
        inner(1)
    }
}
"""

[[case]]
name = "closure_in_long_chain"
source = "fn f() { items.filter(|x| x > 0).map(|x| x * 2).collect() }"
