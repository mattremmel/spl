[section]
id = "expr.closures"
spec_chapter = "4"
name = "Closure Expressions"

[[case]]
name = "closure_basic"
source = "fn f() { |x| x + 1 }"

[[case]]
name = "closure_empty_params"
source = "fn f() { || 42 }"

[[case]]
name = "closure_block_body"
source = """
fn f() {
    |x| {
        let y = x + 1
        return y
    }
}
"""

[[case]]
name = "closure_typed_params"
source = "fn f() { |x: i32| x + 1 }"

[[case]]
name = "closure_multi_params"
source = "fn f() { |a, b| a + b }"
