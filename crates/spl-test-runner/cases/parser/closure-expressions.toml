[section]
id = "expr.closures"
spec_chapter = "4"
name = "Closure Expressions"

[[case]]
name = "closure_basic"
source = "fn f() { |x| x + 1 }"

[[case]]
name = "closure_empty_params"
source = "fn f() { || 42 }"

[[case]]
name = "closure_block_body"
source = """
fn f() {
    |x| {
        let y = x + 1
        return y
    }
}
"""

[[case]]
name = "closure_typed_params"
source = "fn f() { |x: i32| x + 1 }"

[[case]]
name = "closure_multi_params"
source = "fn f() { |a, b| a + b }"

[[case]]
name = "closure_capture_simple"
source = "fn f() { @[x] |y| x + y }"

[[case]]
name = "closure_capture_expr"
source = "fn f() { @[x: &x] || x }"

[[case]]
name = "closure_capture_multiple"
source = "fn f() { @[x, y: &y] |z| x + y + z }"

[[case]]
name = "closure_capture_empty"
source = "fn f() { @[] || 42 }"

[[case]]
name = "closure_mut_param"
source = "fn f() { |mut x: i32| x }"

[[case]]
name = "closure_trailing_comma"
source = "fn f() { |a: i32, b: i32,| a + b }"

[[case]]
name = "closure_block_multi_stmt"
source = """
fn f() {
    let add = |a: i32, b: i32| {
        let sum = a + b
        sum
    }
}
"""

[[case]]
name = "closure_capture_by_ref"
source = """fn f() { let c = @[x: &x]|y| x + y }"""

[[case]]
name = "closure_as_argument"
source = """fn f() { items.map(|x| x + 1) }"""

[[case]]
name = "closure_nested"
source = """fn f() { let f = |x| |y| x + y }"""

[[case]]
name = "closure_in_method_chain"
source = "fn f() { items.filter(|x| x > 0).map(|x| x * 2) }"

[[case]]
name = "closure_capture_ref"
source = "fn f() { @[x: &x] |y| x + y }"

[[case]]
name = "closure_empty_capture"
source = "fn f() { @[] |x| x + 1 }"

[[case]]
name = "closure_multi_capture_mixed"
source = "fn f() { @[a, b: &b] || a + b }"

[[case]]
name = "closure_capture_with_clone_expr"
source = "fn f() { @[x: &x, y: clone(y)] |z| x + y + z }"

[[case]]
name = "closure_nested_in_closure"
source = """
fn f() {
    let outer = |x| {
        let inner = |y| x + y
        inner(1)
    }
}
"""

[[case]]
name = "closure_in_long_chain"
source = "fn f() { items.filter(|x| x > 0).map(|x| x * 2).collect() }"

[[case]]
name = "closure_capture_clone_expr"
source = "fn f() { @[x: x.clone(), y] |z| x + y + z }"

[[case]]
name = "closure_empty_body"
source = "fn f() { || {} }"

[[case]]
name = "closure_in_method_chain_complex"
source = "fn f() { items.map(|x| x * 2).filter(|x| x > 0).collect() }"

[[case]]
name = "closure_body_if_expr"
source = "fn f() { |x| if x > 0 { x } else { 0 - x } }"

[[case]]
name = "closure_capture_trailing_comma"
source = "fn f() { @[x, y,] || x + y }"

[[case]]
name = "closure_in_call_arg"
source = "fn f() { items.map(|x| x * 2) }"

[[case]]
name = "closure_nested_captures"
source = "fn f() { @[x] |y| @[x, y] |z| x + y + z }"

[[case]]
name = "closure_returning_closure"
source = "fn f() { let f = |x: i32| |y: i32| x + y }"

[[case]]
name = "closure_typed_params_and_block"
source = """
fn f() {
    let c = |a: i32, b: i32| {
        let sum = a + b
        let product = a * b
        (sum, product)
    }
}
"""

[[case]]
name = "closure_as_direct_call_arg"
source = "fn f() { execute(|x| x * 2, data) }"

[[case]]
name = "closure_only_typed_params"
source = "fn f() { |x: i32, y: String, z: bool| x }"

[[case]]
name = "closure_with_match_body"
source = """
fn f() {
    let handler = |x| match x {
        .Some(v) => v,
        .None => 0,
    }
}
"""
