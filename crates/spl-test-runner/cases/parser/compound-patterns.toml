[section]
id = "patterns.compound"
spec_chapter = "5"
name = "Compound Patterns"

[[case]]
name = "pat_tuple"
source = "fn f() { let (a, b) = pair }"

[[case]]
name = "pat_slice"
source = """
fn f() {
    match arr {
        [a, b] => a + b,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_slice_rest"
source = """
fn f() {
    match arr {
        [first, ..rest] => first,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_slice_rest_end"
source = """
fn f() {
    match arr {
        [.., last] => last,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_struct"
source = """
fn f() {
    match p {
        Point(x, y) => x + y,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_struct_rename"
source = """
fn f() {
    match p {
        Point(x: a, y: b) => a + b,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_struct_rest"
source = """
fn f() {
    match p {
        Point(x, ..) => x,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_enum_shorthand"
source = """
fn f() {
    match opt {
        .Some(x) => x,
        .None => 0,
    }
}
"""

[[case]]
name = "pat_reference"
source = "fn f() { let &x = r }"

[[case]]
name = "pat_ref_mut"
source = "fn f() { let &mut x = r }"

[[case]]
name = "pat_or"
source = """
fn f() {
    match x {
        1 | 2 | 3 => 1,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_grouped"
source = """
fn f() {
    match x {
        (1 | 2) => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "pat_slice_middle_rest"
source = """
fn f() {
    match arr {
        [first, ..middle, last] => first + last,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_enum_full_path"
source = """
fn f() {
    match x {
        Option.Some(v) => v,
        Option.None => 0,
    }
}
"""

[[case]]
name = "pat_enum_shorthand_named"
source = """
fn f() {
    match msg {
        .Move(x: a, y: b) => a + b,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_enum_with_rest"
source = """
fn f() {
    match msg {
        .Move(x, ..) => x,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_nested"
source = """
fn f() {
    match x {
        (Point(a, _), .Some(b)) => a + b,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_empty_tuple"
source = "fn f() { let () = unit_val }"

[[case]]
name = "pat_empty_slice"
source = """
fn f() {
    match arr {
        [] => 0,
        _ => 1,
    }
}
"""

[[case]]
name = "pat_or_enum_variants"
source = """
fn f() {
    match x {
        .Some(v) | .None => 0,
    }
}
"""

[[case]]
name = "pat_grouped_or"
source = """
fn f() {
    match x {
        (1 | 2 | 3) => "small",
        _ => "other",
    }
}
"""

[[case]]
name = "pat_enum_shorthand_with_rest"
source = """
fn f() {
    match msg {
        .Move(x, ..) => x,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_slice_empty_rest"
source = """
fn f() {
    match items {
        [..] => "any",
    }
}
"""

[[case]]
name = "pat_nested_deep"
source = """
fn f() {
    match data {
        .Some((Point(x, _), [first, ..])) => x + first,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_or_with_bindings"
source = """
fn f() {
    match opt {
        .Some(x) | .Other(x) => x,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_or_inside_tuple"
source = "fn f() { let (1 | 2, b) = pair }"

[[case]]
name = "pat_wildcard_in_struct"
source = """
fn f() {
    match p {
        Point(_, y) => y,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_enum_nested_struct"
source = """
fn f() {
    match x {
        .Some(Point(x, y)) => x + y,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_dollar_path"
source = """
fn f() {
    match x {
        $.constants.MAX => true,
        _ => false,
    }
}
"""

[[case]]
name = "pat_self_type"
source = """
impl Foo {
    fn check(self) {
        match self {
            Self(a, b) => a + b,
        }
    }
}
"""

[[case]]
name = "pat_enum_shorthand_unit"
source = """
fn f() {
    match opt {
        .None => 0,
        .Some(x) => x,
    }
}
"""

[[case]]
name = "pat_nested_or_in_tuple"
source = """
fn f() {
    match pair {
        (1 | 2, 3 | 4) => true,
        _ => false,
    }
}
"""

[[case]]
name = "pat_enum_shorthand_named_move"
source = """
fn f() {
    match msg {
        .Move(x: dx, y: dy) => dx + dy,
        _ => 0,
    }
}
"""

[[case]]
name = "pat_negative_literal"
source = """
fn f() {
    match x {
        -1 => "neg one",
        0 => "zero",
        _ => "other",
    }
}
"""

[[case]]
name = "pat_multiple_or_with_enum"
source = """
fn f() {
    match color {
        .Red | .Green | .Blue => "primary",
        _ => "other",
    }
}
"""

[[case]]
name = "pat_struct_with_multiple_rest"
source = """
fn f() {
    match p {
        Point(x: a, ..) => a,
    }
}
"""
