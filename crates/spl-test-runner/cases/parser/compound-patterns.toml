[section]
id = "patterns.compound"
spec_chapter = "5"
name = "Compound Patterns"

[[case]]
name = "pat_tuple"
source = "fn f() { let (a, b) = pair }"

[[case]]
name = "pat_slice"
source = """
fn f() {
    match arr {
        [a, b] => a + b,
        _ => 0,
    }
}
"""

[[case]]
