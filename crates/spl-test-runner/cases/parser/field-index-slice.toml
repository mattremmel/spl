[section]
id = "expr.field_index"
spec_chapter = "4"
name = "Field Access, Indexing, and Slicing"

[[case]]
name = "field_access"
source = "fn f() { obj.field }"

[[case]]
name = "field_positional"
source = "fn f() { pair.0 }"

[[case]]
name = "index_basic"
source = "fn f() { arr[0] }"

[[case]]
name = "index_expr"
source = "fn f() { arr[i + 1] }"

[[case]]
name = "field_chain"
source = "fn f() { a.b.c.d }"

[[case]]
name = "index_chain"
source = "fn f() { a[0][1] }"

[[case]]
name = "method_on_index"
source = "fn f() { arr[0].method() }"

[[case]]
name = "optional_chain_field"
source = "fn f() { x?.field }"

[[case]]
name = "optional_chain_method"
source = "fn f() { x?.method() }"

[[case]]
name = "optional_chain_nested"
source = "fn f() { a?.b?.c }"

[[case]]
name = "slice_range"
source = "fn f() { arr[1:3] }"

[[case]]
name = "slice_from_start"
source = "fn f() { arr[:3] }"

[[case]]
name = "slice_to_end"
source = "fn f() { arr[1:] }"

[[case]]
name = "slice_full"
source = "fn f() { arr[:] }"

[[case]]
name = "dollar_index"
source = "fn f() { arr[$-1] }"

[[case]]
name = "dollar_in_slice"
source = "fn f() { arr[1:$-1] }"

[[case]]
name = "try_propagate"
source = "fn f() { result! }"
