[section]
id = "items.functions.self"
spec_chapter = "1.3.1"
name = "Self Parameters"

[[case]]
name = "self_by_value"
source = """
impl Foo {
    fn consume(self) {}
}
"""

[[case]]
name = "self_mut_by_value"
source = """
impl Foo {
    fn take(mut self) {}
}
"""

[[case]]
name = "self_by_ref"
source = """
impl Foo {
    fn inspect(&self): i32 { 0 }
}
"""

[[case]]
name = "self_by_mut_ref"
source = """
impl Foo {
    fn update(&mut self) {}
}
"""

[[case]]
name = "self_in_trait_method"
source = """
trait Consumable {
    fn consume(self)
    fn inspect(&self): bool
    fn mutate(&mut self)
}
"""

[[case]]
name = "self_in_impl_method"
source = """
impl Widget {
    pub fn render(&self): String { "widget".to_string() }
    pub fn resize(&mut self, w: i32, h: i32) {}
    pub fn destroy(self) {}
}
"""

[[case]]
name = "self_with_other_params"
source = """
impl Foo {
    fn method(&self, x: i32, y: i32): i32 { x + y }
}
"""

[[case]]
name = "self_in_gen_fn"
source = """
impl Collection {
    gen fn iter(&self): i32 { yield 0 }
}
"""

[[case]]
name = "self_mut_with_return"
source = """
impl Stack {
    fn pop(&mut self): i32 { 0 }
}
"""

[[case]]
name = "self_with_many_params_and_where"
source = """
impl Container where T: Clone {
    fn transform(&self, f: fn(T): U, default: U): U where U {
        default
    }
}
"""

[[case]]
name = "self_in_unsafe_fn"
source = """
impl Ptr {
    unsafe fn deref(&self): i32 { 0 }
}
"""

[[case]]
name = "self_mut_in_trait_with_return"
source = """
trait MutableContainer {
    fn push(&mut self, item: i32)
    fn pop(&mut self): i32
    fn clear(&mut self)
    fn len(&self): i32
}
"""

[[case]]
name = "self_by_value_consuming_method"
source = """
impl Builder {
    fn build(self): Widget { Widget() }
    fn with_name(mut self, name: String): Builder { self }
}
"""
