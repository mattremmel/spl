[section]
id = "items.generators.comprehensive"
spec_chapter = "1.3"
name = "Generator Comprehensive"

[[case]]
name = "gen_fn_pub"
source = """
pub gen fn items(): i32 {
    yield 1
}
"""

[[case]]
name = "gen_fn_pub_super"
source = """
pub(super) gen fn items(): i32 {
    yield 1
}
"""

[[case]]
name = "gen_fn_complex_yield"
source = """
gen fn computed(): i32 {
    yield 1 + 2 * 3
}
"""

[[case]]
name = "gen_fn_yield_in_if"
source = """
gen fn conditional(flag: bool): i32 {
    if flag {
        yield 1
    } else {
        yield 0
    }
}
"""

[[case]]
name = "gen_fn_return_throws_where"
source = """
gen fn items(): i32 throws Error where T: Clone {
    yield 0
}
"""

[[case]]
name = "gen_fn_in_impl"
source = """
impl Collection {
    gen fn iter(&self): i32 {
        yield 0
    }
    gen fn iter_mut(&mut self): i32 {
        yield 0
    }
}
"""

[[case]]
name = "gen_fn_yield_in_for"
source = """
gen fn flatten(): i32 {
    for list in lists {
        for item in list {
            yield item
        }
    }
}
"""

[[case]]
name = "gen_fn_yield_in_while"
source = """
gen fn take_while(): i32 {
    while cond {
        yield next()
    }
}
"""

[[case]]
name = "gen_fn_multiple_params"
source = """
gen fn range(start: i32, end: i32, step: i32 = 1): i32 {
    let i = start
    while i < end {
        yield i
        i = i + step
    }
}
"""

[[case]]
name = "gen_fn_empty_body"
source = """
gen fn empty(): i32 {}
"""

[[case]]
name = "gen_fn_attr"
source = "#[inline] gen fn items(): i32 { yield 1; yield 2 }"

[[case]]
name = "gen_fn_throw_and_yield"
source = """
gen fn items(): i32 throws Error {
    yield 1;
    throw .ParseError
}
"""

[[case]]
name = "gen_fn_where_bounds"
source = "gen fn items(list: T): T where T: Clone { yield list }"

[[case]]
name = "gen_fn_default_and_label"
source = "gen fn items(_ x: i32 = 0): i32 { yield x }"

[[case]]
name = "gen_fn_no_return_type"
source = "gen fn items() { yield 1 }"

[[case]]
name = "gen_fn_where_throws_combined"
source = """
gen fn items(list: T): i32 throws Error where T: Clone {
    yield 0
}
"""

[[case]]
name = "gen_fn_default_params"
source = "gen fn range(start: i32 = 0, end: i32 = 10): i32 { yield start }"

[[case]]
name = "gen_fn_pub_super"
source = """
pub(super) gen fn items(): i32 {
    yield 0
}
"""

[[case]]
name = "gen_fn_with_attribute"
source = "#[inline] gen fn fast_items(): i32 { yield 1; yield 2 }"

[[case]]
name = "gen_fn_in_trait"
expect_error = "expected trait item"
source = """
trait Iterable {
    gen fn items(&self): i32
}
"""

[[case]]
name = "gen_fn_yield_in_match"
source = """
gen fn transform(items: [i32]): String {
    for item in items {
        match item {
            0 => yield "zero",
            _ => yield "other",
        }
    }
}
"""
