[section]
id = "items.inner_attributes"
spec_chapter = "1.1"
name = "Inner Attributes"

[[case]]
name = "inner_attr_file_level"
source = """
#![allow(unused)]
fn foo() {}
"""

[[case]]
name = "inner_attr_in_module"
expect_error = "expected"
source = """
module foo {
    #![feature(test)]
    fn bar() {}
}
"""

[[case]]
name = "inner_attr_in_impl"
expect_error = "expected"
source = """
impl Foo {
    #![allow(dead_code)]
    fn bar() {}
}
"""

[[case]]
name = "inner_attr_multiple"
source = """
#![allow(unused)]
#![feature(test)]
#![cfg(target_os = "linux")]
fn foo() {}
"""

[[case]]
name = "inner_attr_complex_args"
source = """
#![cfg(all(target_os = "linux", target_arch = "x86_64"))]
fn foo() {}
"""

[[case]]
name = "inner_and_outer_attrs_mixed"
source = """
#![allow(unused)]
#[inline]
fn foo() {}
#[test]
fn bar() {}
"""

[[case]]
name = "inner_attr_in_function_body"
expect_error = "expected"
source = """
fn f() {
    #![allow(unused)]
    let x = 1
}
"""

[[case]]
name = "inner_attr_in_trait"
expect_error = "expected"
source = """
trait Bar {
    #![cfg(test)]
    fn method(&self)
}
"""

[[case]]
name = "inner_attr_in_extern_block"
expect_error = "expected"
source = """
extern {
    #![link(name = "c")]
    fn puts(s: &str)
}
"""

[[case]]
name = "inner_attr_multiple_file_level"
source = """
#![allow(unused)]
#![warn(dead_code)]
#![feature(test)]
fn foo() {}
"""

[[case]]
name = "inner_attr_with_string_value"
source = """
#![doc = "Module documentation"]
fn foo() {}
"""

[[case]]
name = "inner_attr_with_nested_args"
source = """
#![cfg(all(target_os = "linux", feature = "test"))]
fn foo() {}
"""
