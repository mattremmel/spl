[section]
id = "items.enums"
spec_chapter = "1.5"
name = "Enum Definitions"

[[case]]
name = "enum_unit_variants"
source = "enum Color { Red, Green, Blue }"

[[case]]
name = "enum_tuple_variants"
source = """
enum Option {
    Some(i32),
    None,
}
"""

[[case]]
name = "enum_struct_variants"
source = """
enum Message {
    Quit,
    Move(x: i32, y: i32),
    Write(String),
}
"""

[[case]]
name = "enum_mixed"
source = """
enum Event {
    Click(x: i32, y: i32),
    Key(char),
    Quit,
}
"""

[[case]]
name = "enum_where_after_brace"
source = """
enum Option {
    Some(T),
    None,
} where T
"""

[[case]]
name = "enum_trailing_comma"
source = "enum Color { Red, Green, Blue, }"

[[case]]
name = "enum_empty"
source = "enum Empty {}"

[[case]]
name = "enum_multiple_type_params"
source = """
enum Result {
    Ok(T),
    Err(E),
} where T, E
"""

[[case]]
name = "enum_tuple_3_fields"
source = """
enum Msg {
    Color(u8, u8, u8),
}
"""

[[case]]
name = "enum_variant_trailing_comma_fields"
source = """
enum Msg {
    Move(x: i32, y: i32,),
}
"""

[[case]]
name = "enum_where_multiple_bounds"
source = """
enum Container {
    Item(T),
    Empty,
} where T: Clone + Debug
"""

[[case]]
name = "enum_pub_with_attributes"
source = """
#[repr(C)]
pub enum Color { Red, Green, Blue }
"""

[[case]]
name = "enum_single_variant"
source = """
enum Unit { Only }
"""

[[case]]
name = "enum_variant_single_tuple_field"
source = """
enum Wrapper { Value(T) } where T
"""

[[case]]
name = "enum_variant_mixed_data_styles"
source = "enum Msg { Quit, Move(x: i32, y: i32), Data(String, i32) }"

[[case]]
name = "enum_attr_on_variant"
expect_error = "expected"
source = "enum Color { #[deprecated] Red, Green, Blue }"

[[case]]
name = "enum_where_bound_and_default"
source = "enum Container { Item(T), Empty } where T: Clone = i32"

[[case]]
name = "enum_single_variant_tuple"
source = "enum Wrapper { Value(i32) }"

[[case]]
name = "enum_all_variant_styles_with_where"
source = """
enum Shape {
    Circle(f64),
    Rectangle(width: f64, height: f64),
    Empty,
} where T: Clone
"""

[[case]]
name = "enum_variant_multiple_named_fields"
source = """
enum Event {
    MouseMove(x: i32, y: i32, button: i32),
    KeyPress(code: i32, shift: bool, ctrl: bool),
}
"""

[[case]]
name = "enum_single_named_field"
source = "enum Wrapper { Named(value: i32) }"

[[case]]
name = "enum_nested_generic"
source = """
enum Tree {
    Leaf(T),
    Node(Box(T: Tree), Box(T: Tree)),
} where T
"""

[[case]]
name = "enum_many_variants"
source = """
enum Direction {
    North,
    South,
    East,
    West,
    Up,
    Down,
}
"""

[[case]]
name = "enum_variant_all_named_fields"
source = """
enum Shape {
    Circle(radius: f64),
    Rectangle(width: f64, height: f64),
}
"""

[[case]]
name = "enum_variant_all_positional_fields"
source = """
enum Pair {
    Ints(i32, i32),
    Floats(f64, f64),
}
"""

[[case]]
name = "enum_where_multiple_defaults"
source = "enum Container { Item(T) } where T: Clone = i32, U = String"

[[case]]
name = "enum_pub_super"
source = "pub(super) enum Internal { A, B }"

[[case]]
name = "enum_pub_dollar"
source = "pub($) enum CrateEnum { X, Y }"

[[case]]
name = "enum_variant_single_positional"
source = "enum Boxed { Value(i32) }"

[[case]]
name = "enum_variant_complex_types"
source = """
enum Data {
    Array([i32; 10]),
    Ref(&str),
    Optional(i32?),
    Tuple((i32, bool)),
}
"""

[[case]]
name = "enum_nested_enum_type_in_variant"
source = """
enum Outer {
    Inner(Option(T: i32)),
    Wrapped(Vec(T: String)),
}
"""

[[case]]
name = "enum_where_three_params"
source = """
enum Map {
    Entry(K, V),
    Empty,
} where K: Hash + Eq, V, E: Debug
"""
