[section]
id = "error-recovery.comprehensive"
spec_chapter = "1.1"
name = "Error Recovery Comprehensive"

[[case]]
name = "missing_closing_brace"
source = """
fn foo() {
    let x = 1
"""
expect_error = "expected"

[[case]]
name = "missing_closing_paren_fn"
source = """
fn foo(a: i32, b: i32 {
    a + b
}
"""
expect_error = "expected"

[[case]]
name = "invalid_pattern"
source = """
fn foo() {
    let + = 1
}
"""
expect_error = "expected"

[[case]]
name = "missing_match_brace"
source = """
fn foo() {
    match x {
        1 => "one",
}
"""
expect_error = "expected"

[[case]]
name = "missing_enum_brace"
source = """
enum Color { Red, Green,
"""
expect_error = "expected"

[[case]]
name = "extra_comma_in_params"
source = """
fn foo(a: i32,, b: i32) {}
"""
expect_error = "expected"

[[case]]
name = "missing_type_in_let"
source = """
fn foo() {
    let x: = 1
}
"""
expect_error = "expected"

[[case]]
name = "fn_body_recovery"
source = """
fn broken() {
    let x = @@@
}
fn valid() {}
"""
expect_error = "expected"

[[case]]
name = "missing_closing_bracket_array"
source = """
fn f() {
    let x = [1, 2, 3
}
"""
expect_error = "expected"

[[case]]
name = "missing_match_arrow"
source = """
fn f() {
    match x {
        0 "zero",
    }
}
"""
expect_error = "expected"

[[case]]
name = "invalid_type_annotation"
source = """
fn f() {
    let x: = 1
}
"""
expect_error = "expected"

[[case]]
name = "missing_use_path"
source = "use"
expect_error = "expected"

[[case]]
name = "malformed_where_clause"
source = "fn foo() where {}"
expect_error = "expected"

[[case]]
name = "double_comma_in_struct"
source = "struct Foo(x: i32,, y: i32)"
expect_error = "expected"

[[case]]
name = "missing_impl_body"
source = "impl Foo"
expect_error = "expected"

[[case]]
name = "missing_trait_body"
source = "trait Foo"
expect_error = "expected"
