[section]
id = "error-recovery.comprehensive"
spec_chapter = "1.1"
name = "Error Recovery Comprehensive"

[[case]]
name = "missing_closing_brace"
source = """
fn foo() {
    let x = 1
"""
expect_error = "expected"

[[case]]
name = "missing_closing_paren_fn"
source = """
fn foo(a: i32, b: i32 {
    a + b
}
"""
expect_error = "expected"

[[case]]
name = "invalid_pattern"
source = """
fn foo() {
    let + = 1
}
"""
expect_error = "expected"

[[case]]
name = "missing_match_brace"
source = """
fn foo() {
    match x {
        1 => "one",
}
"""
expect_error = "expected"

[[case]]
name = "missing_enum_brace"
source = """
enum Color { Red, Green,
"""
expect_error = "expected"

[[case]]
name = "extra_comma_in_params"
source = """
fn foo(a: i32,, b: i32) {}
"""
expect_error = "expected"

[[case]]
name = "missing_type_in_let"
source = """
fn foo() {
    let x: = 1
}
"""
expect_error = "expected"

[[case]]
name = "fn_body_recovery"
source = """
fn broken() {
    let x = @@@
}
fn valid() {}
"""
expect_error = "expected"

[[case]]
name = "missing_closing_bracket_array"
source = """
fn f() {
    let x = [1, 2, 3
}
"""
expect_error = "expected"

[[case]]
name = "missing_match_arrow"
source = """
fn f() {
    match x {
        0 "zero",
    }
}
"""
expect_error = "expected"

[[case]]
name = "invalid_type_annotation"
source = """
fn f() {
    let x: = 1
}
"""
expect_error = "expected"

[[case]]
name = "missing_use_path"
source = "use"
expect_error = "expected"

[[case]]
name = "malformed_where_clause"
source = "fn foo() where {}"
expect_error = "expected"

[[case]]
name = "double_comma_in_struct"
source = "struct Foo(x: i32,, y: i32)"
expect_error = "expected"

[[case]]
name = "missing_impl_body"
source = "impl Foo"
expect_error = "expected"

[[case]]
name = "missing_trait_body"
source = "trait Foo"
expect_error = "expected"

[[case]]
name = "missing_field_type_in_struct"
expect_error = "expected"
source = "struct S(x:)"

[[case]]
name = "missing_variant_data_close_paren"
expect_error = "expected"
source = "enum E { V(i32 }"

[[case]]
name = "missing_arm_body_in_match"
source = """
fn f() {
    match x {
        1 => ,
        2 => "two",
    }
}
"""

[[case]]
name = "unclosed_generic_args"
expect_error = "expected"
source = "fn f(x: Vec(T: i32) {}"

[[case]]
name = "missing_condition_in_if"
expect_error = "expected"
source = "fn f() { if { 1 } }"

[[case]]
name = "missing_body_in_while"
expect_error = "expected"
source = "fn f() { while true }"

[[case]]
name = "missing_iterable_in_for"
expect_error = "expected"
source = "fn f() { for x in {} }"

[[case]]
name = "double_colon_in_path"
expect_error = "expected"
source = "use std::vec"

[[case]]
name = "arrow_return_type"
expect_error = "expected"
source = "fn f() -> i32 { 0 }"

[[case]]
name = "missing_equals_in_let"
source = "fn f() { let x: i32 1 }"  # Parser accepts: `let x: i32` (no init) then `1` as expr stmt

[[case]]
name = "rust_angle_bracket_generics"
expect_error = "expected"
source = "fn f(x: Vec<i32>) {}"

[[case]]
name = "rust_dyn_trait"
expect_error = "expected"
source = "fn f(x: &dyn Clone) {}"

[[case]]
name = "rust_impl_trait_in_param"
expect_error = "expected"
source = "fn f(x: impl Clone) {}"
