[section]
id = "items.impls"
spec_chapter = "1.7"
name = "Implementation Blocks"

[[case]]
name = "impl_inherent"
source = """
impl Point {
    fn new(x: f64, y: f64): Point {
        return Point(x: x, y: y)
    }
}
"""

[[case]]
name = "impl_with_where"
source = """
impl Box where T {
    fn unwrap(self): i32 {
        return 0
    }
}
"""

[[case]]
name = "impl_pub_methods"
source = """
impl Point {
    pub fn x(&self): f64 { return 0.0 }
    pub fn y(&self): f64 { return 0.0 }
}
"""

[[case]]
name = "impl_multiple_methods"
source = """
impl Stack {
    fn push(&mut self, value: i32) {}
    fn pop(&mut self): i32 { return 0 }
    fn len(&self): i32 { return 0 }
}
"""

[[case]]
name = "impl_missing_brace"
expect_error = "expected"
source = "impl Foo fn bar() {} }"

[[case]]
name = "impl_trait_for_type"
source = """
impl Clone for Point {
    fn clone(&self): Self {
        return self
    }
}
"""

[[case]]
name = "impl_with_generic_args"
source = """
impl Box where T {
    fn unwrap(self): i32 {
        return 0
    }
}
"""

[[case]]
name = "impl_unsafe"
source = "unsafe impl Send for MyType {}"

[[case]]
name = "impl_type_assignment"
source = """
impl Foo {
    type Output = i32
}
"""

[[case]]
name = "impl_method_where"
source = """
impl Vec where T {
    fn convert(&self): i32 where U {}
}
"""

[[case]]
name = "impl_concrete_type_arg"
source = """
impl Vec(T: u32) {
    fn sum(&self): u32 { 0 }
}
"""

[[case]]
name = "impl_method_level_where"
source = """
impl Container(T) {
    fn convert(&self): U where U: From(T) { U.from(self.value) }
}
"""

[[case]]
name = "impl_trait_with_generic_args"
source = """
impl Clone for Option(T: T) where T: Clone {
    fn clone(&self): Self { self }
}
"""

[[case]]
name = "impl_unsafe_trait"
source = """
unsafe impl Send for MyType {}
"""

[[case]]
name = "impl_multiple_methods_with_vis"
source = """
impl Foo {
    pub fn public_method(&self) {}
    fn private_method(&self) {}
    pub fn another_public(&mut self) {}
}
"""

[[case]]
name = "impl_type_assignment_generic"
source = """
impl Foo {
    type Output = Vec(T: i32)
}
"""

[[case]]
name = "impl_trait_with_generic_arg"
source = """
impl Add(RHS: Vector) for Point {
    fn add(self): Point { self }
}
"""

[[case]]
name = "impl_multiple_type_assignments"
source = """
impl Foo {
    type A = i32
    type B = String
}
"""

[[case]]
name = "impl_method_level_where_convert"
source = """
impl Foo {
    fn convert(&self): U where U {}
}
"""

[[case]]
name = "impl_unsafe_trait_for_generic_with_where"
source = """
unsafe impl Send for Box(T: T) where T: Send {}
"""

[[case]]
name = "impl_unsafe_with_methods"
source = """
unsafe impl Sync for Foo {
    fn check(&self): bool { true }
}
"""

[[case]]
name = "impl_method_using_self_output"
source = """
impl Processor {
    fn compute(&self): Self.Output { self.value }
}
"""

[[case]]
name = "impl_different_generic_name"
source = """
impl Wrapper(T: R) where R {
    fn get(&self): &R { &self.inner }
}
"""

[[case]]
name = "impl_gen_fn"
source = """
impl Collection {
    gen fn iter(&self): i32 { yield 0 }
}
"""

[[case]]
name = "impl_empty_inherent"
source = "impl Foo {}"

[[case]]
name = "impl_const_fn_method"
source = """
impl Config {
    const fn default(): Config { Config(value: 0) }
}
"""

[[case]]
name = "impl_trait_with_assoc_type"
source = """
impl Iterator for MyIter {
    type Item = i32
    fn next(&mut self): Self.Item? { .None }
}
"""

[[case]]
name = "impl_attributed"
source = """
#[derive(Clone)]
impl Foo {
    fn new(): Self { Self(x: 0) }
}
"""

[[case]]
name = "impl_generic_trait_for_generic_type"
source = """
impl From(T: String) for MyType {
    fn from(s: String): Self { Self(value: s) }
}
"""

[[case]]
name = "impl_only_type_assignments"
source = """
impl Foo {
    type Input = String
    type Output = i32
    type Error = IoError
}
"""

[[case]]
name = "impl_const_and_unsafe_method_mix"
source = """
impl Foo {
    const fn default(): Self { Self(x: 0) }
    unsafe fn dangerous(&self): i32 { 0 }
    pub fn normal(&self) {}
}
"""

[[case]]
name = "impl_generator_method"
source = """
impl Collection {
    gen fn iter(&self): i32 { yield 0 }
    gen fn iter_mut(&mut self): i32 { yield 0 }
}
"""

[[case]]
name = "impl_method_level_where_complex"
source = """
impl Container(T) {
    fn convert(&self): Vec(T: U) where U, T: Into(Target: U) { Vec.new() }
}
"""

[[case]]
name = "impl_trait_with_multiple_assoc_types"
source = """
impl Iterator for MyIter {
    type Item = i32
    type Error = String
    fn next(&mut self): Self.Item? { .None }
}
"""

[[case]]
name = "impl_where_on_both_impl_and_method"
source = """
impl Container where T: Clone {
    fn convert(&self): U where U: From(T: T) { U.from(self.value) }
}
"""

[[case]]
name = "impl_pub_super_method"
source = """
impl Foo {
    pub(super) fn internal_method(&self): i32 { 0 }
}
"""

[[case]]
name = "impl_method_with_all_features"
source = """
impl Foo {
    #[inline]
    pub const unsafe fn complex(from input: T, _ scale: f64 = 1.0): Output throws Error where T: Clone, Output {
        input
    }
}
"""

# Unsafe impl interactions

[[case]]
name = "impl_unsafe_trait_empty"
source = "unsafe impl Send for MyType {}"

[[case]]
name = "impl_unsafe_trait_with_method"
source = """
unsafe impl Sync for MyType {
    fn is_sync(&self): bool { true }
}
"""

[[case]]
name = "impl_unsafe_trait_generic"
source = "unsafe impl Send for Box(T: T) where T: Send {}"

[[case]]
name = "impl_unsafe_fn_in_inherent"
source = """
impl Buffer {
    unsafe fn raw_ptr(&self): i32 { 0 }
    fn safe_method(&self): i32 { 1 }
}
"""

[[case]]
name = "impl_unsafe_trait_with_type_assignment"
source = """
unsafe impl Iterator for UnsafeIter {
    type Item = i32
