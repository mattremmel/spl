[section]
id = "items.functions"
spec_chapter = "1.3"
name = "Function Definitions"

[[case]]
name = "fn_minimal"
source = "fn foo() {}"

[[case]]
name = "fn_with_return_type"
source = """
fn add(a: i32, b: i32): i32 {
    return a + b
}
"""

[[case]]
name = "fn_with_params"
source = "fn greet(name: String) {}"

[[case]]
name = "fn_self_param"
source = """
impl Foo {
    fn method(&self) {}
}
"""

[[case]]
name = "fn_mut_self"
source = """
impl Foo {
    fn mutate(&mut self) {}
}
"""

